ent is:", "o": ["Discounted", "Not discounted, paid daily", "Paid only at maturity"], "a": 1, "why": "期貨每日按市價結算，唔折現。"}], "sheet": {"facts": ["Clearing house 做每個人嘅對手 → 幾乎冇信貸風險", "Initial margin = 開倉按金 · Maintenance margin = 最低水平", "Mark to market：每日按收市價計盈虧（variation margin）", "跌穿 maintenance → margin call → 補返去 <b>initial<\/b>", "期貨每日結算、唔折現；FRA 期頭結算、要折現"], "how": ["每日 P/L = ticks × tick value", "戶口 = 昨日餘額 + 今日 P/L", "< maintenance？→ 補到 initial"]}}, {"id": "3.10", "lec": "L3", "zh": "方向題：加息邊個賺？", "en": "Direction: who gains when rates rise?", "sl": [30, 36], "idea": "<b>加息 → 期貨價跌<\/b>。所以 <b>買 FRA ≈ 賣期貨<\/b>（都係加息賺）。賣咗 FRA 就要<b>賣期貨<\/b>對沖。", "terms": [["long futures", "買入期貨"], ["short futures", "賣出期貨"], ["speculation", "投機"]], "params": [], "steps": [{"c": "利率升（<b class=\"k4\">紫色<\/b>）→ 期貨價跌。", "f": "Rates <b class=\"k4\">↑<\/b> → futures price ↓ (price = 100 − rate)"}, {"c": "加息：<b class=\"k3\">FRA buyer 賺<\/b>（收 LIBOR）；<b class=\"k2\">futures buyer 蝕<\/b>（價跌）。", "f": "Rates ↑: FRA buyer <b class=\"k3\">gains<\/b> · futures buyer <b class=\"k2\">loses<\/b>"}, {"c": "所以 <b class=\"k1\">buy FRA ≈ sell futures<\/b>；sell FRA ≈ buy futures。賣咗 FRA（加息蝕），對沖就要 <b class=\"k1\">sell futures<\/b>（加息賺）。", "f": "Buy FRA ≈ sell futures · Sold an FRA → hedge by <b class=\"k1\">selling futures<\/b>"}, {"c": "投機：預期加息 → <b class=\"k3\">sell futures<\/b>；預期減息 → <b class=\"k3\">buy futures<\/b>。", "f": "Expect rates ↑ → <b class=\"k3\">sell futures<\/b> · expect rates ↓ → <b class=\"k3\">buy futures<\/b>"}], "tips": [], "mc": [{"q": "If interest rates rise, the buyer of futures will:", "o": ["Gain", "Lose"], "a": 1, "why": "利率升，期貨價跌，好倉蝕。"}, {"q": "A trader SELLS an FRA. To cover the position with futures he should:", "o": ["Buy futures", "Sell futures"], "a": 1, "why": "賣 FRA 加息蝕；賣期貨加息賺，互相抵銷。"}, {"q": "A trader expects rates to FALL. To speculate, he should:", "o": ["Buy futures", "Sell futures"], "a": 0, "why": "減息 → 期貨價升 → 買入賺。"}], "sheet": {"facts": ["利率 ↑ → FRA 買方賺 · 期貨買方蝕", "買 FRA ≈ 賣期貨（方向一樣）", "賣咗 FRA → 用<b>賣<\/b>期貨對沖", "預期加息 → 賣期貨 · 預期減息 → 買期貨"]}}, {"id": "3.11", "lec": "L3", "zh": "由期貨計 FRA 同對沖比率", "en": "FRA rate from futures and the hedge ratio", "sl": [31, 32], "idea": "FRA 同期貨喺<b>同一日<\/b>定息，所以 FRA rate = 期貨隱含利率。合約數要調整：<b>期貨用 90 日、唔折現<\/b>；FRA 用真實日數、要折現。", "terms": [["implied rate", "隱含利率"], ["hedge ratio", "對沖比率"], ["last trading day", "最後交易日"]], "params": [{"l": "FRA 本金 (百萬)", "v": "$10m"}, {"l": "FRA 日數", "v": "92 d"}, {"l": "June 期貨利率", "v": "8.25%"}], "steps": [{"c": "17 March：June 期貨 91.75 → 隱含 <b class=\"k1\">8.25%<\/b>；Sept 91.50 → 8.50%；Dec 91.25 → 8.75%。", "f": "June 100 − 91.75 = <b class=\"k1\">8.25%<\/b> · Sept 8.50% · Dec 8.75%"}, {"c": "賣 3 v 6 FRA（19 Jun → 19 Sep，92 日），17 June 定息；June 期貨最後交易日都係 17 June，所以 FRA rate = <b class=\"k1\">8.25%<\/b>。", "f": "FRA fixes 17 June = June futures last trading day → FRA rate = <b class=\"k1\">8.25%<\/b>"}, {"c": "對沖比率（<b class=\"k2\">橙色<\/b>）：FRA 92 日、要折現；期貨 90 日、唔折現。", "f": "n = 10 × (<b class=\"k2\">92<\/b>/90) / (1 + 0.0825 × 92/360) = <b class=\"k3\">10.01<\/b>"}, {"c": "所以 <b class=\"k4\">賣 10 張 June 期貨<\/b>（賣 FRA → 賣期貨）。", "f": "→ <b class=\"k4\">sell 10 June futures<\/b>"}], "tips": [], "mc": [{"q": "Hedge a sold 3v6 FRA on $20m, 91 days, futures rate 4.5% ($1m contracts). Unrounded contracts?", "o": ["20.00", "19.99", "20.22", "19.78"], "a": 1, "why": "20 × 91/90 / (1 + 0.045 × 91/360) = 19.99 → 20 張。"}, {"q": "To hedge a 3v6 FRA starting 19 June, use futures that expire in:", "o": ["March", "June", "September"], "a": 1, "why": "June 期貨最後交易日同 FRA 定息日一樣（17 June）。"}, {"q": "Why is the hedge ratio not exactly notional ÷ contract size?", "o": ["Futures use a 90-day basis and are not discounted", "Futures are quoted as yields", "The FRA has no notional"], "a": 0, "why": "要調整 FRA 日數 vs 90 日，同埋 FRA 折現。"}], "sheet": {"f": [{"t": "對沖張數", "m": "n = (N / contract size) × (FRA days / 90) ÷ (1 + rate × FRA days / 360)"}], "how": ["起步：本金 ÷ 合約金額（$10m ÷ $1m = 10）", "× FRA 日數 / 90（期貨用 90 日）", "÷ (1 + rate × days/360)（FRA 折現、期貨唔折現）", "四捨五入成整數", "用最後交易日同 FRA 定息日一樣嘅月份（June）"], "trap": ["賣 FRA → 賣期貨", "隱含利率 = 100 − 期貨價"]}}, {"id": "3.12", "lec": "L3", "zh": "3v9 FRA 對沖同不完全對沖", "en": "3v9 FRA strip hedge and imperfect hedging", "sl": [33, 34], "idea": "<b>3v9 = 3v6 + 6v9 串埋<\/b>，所以用 June + Sept 期貨一齊對沖。期貨對沖<b>唔會完美<\/b>，記住四個原因。", "terms": [["strip hedge", "串連對沖"], ["imperfect hedge", "不完全對沖"], ["basis", "基差"]], "params": [{"l": "June 隱含 (92d)", "v": "8.25%"}, {"l": "Sept 隱含 (91d)", "v": "8.50%"}, {"l": "Dec 隱含 (91d)", "v": "8.75%"}], "steps": [{"c": "3 v 9 = <b class=\"k1\">3 v 6<\/b>（June）+ <b class=\"k2\">6 v 9<\/b>（Sept）。", "f": "3 v 9 = <b class=\"k1\">3 v 6 @ 8.25%<\/b> + <b class=\"k2\">6 v 9 @ 8.50%<\/b>"}, {"c": "將兩段 growth 相乘，用總日數 183 年化（<b class=\"k3\">綠色<\/b>）。", "f": "[(1 + 0.0825 × 92/360)(1 + 0.0850 × 91/360) − 1] × 360/183 = <b class=\"k3\">8.463%<\/b>"}, {"c": "對沖：賣 3v6 + 賣 6v9 → <b class=\"k4\">賣 10 張 June + 賣 10 張 Sept<\/b>。6 v 12 就用 Sept + Dec。", "f": "Hedge: <b class=\"k4\">sell 10 June + sell 10 Sept<\/b> · 6 v 12 = Sept + Dec → 8.719%"}, {"c": "點解唔完美：① 期貨金額標準化 ② 期貨用 90 日，FRA 91/92 日 ③ FRA 結算折現，期貨唔折現 ④ 日子唔完全對齊。", "f": "Imperfect: standard sizes · 90-day basis vs 91/92 · FRA discounted, futures not · date mismatch"}], "tips": [], "mc": [{"q": "A 3 v 9 FRA can be hedged with:", "o": ["June futures only", "June and September futures", "September and December futures"], "a": 1, "why": "3v9 = 3v6（June）+ 6v9（Sept）。"}, {"q": "Sept futures imply 8.50% (91d), Dec 8.75% (91d). Theoretical 6v12 rate?", "o": ["8.625%", "8.719%", "8.463%"], "a": 1, "why": "[(1.021486)(1.022118) − 1] × 360/182 = 8.719%。"}, {"q": "Which is NOT a reason FRA hedging with futures is imperfect?", "o": ["Futures have a standard contract size", "FRA settlements are discounted but futures are not", "Futures have higher credit risk than FRAs"], "a": 2, "why": "期貨信貸風險反而較低；其他三項都係原因。"}], "sheet": {"f": [{"t": "3 v 9 FRA rate", "m": "[(1 + f<sub>Jun<\/sub> × 92/360)(1 + f<sub>Sep<\/sub> × 91/360) − 1] × 360/183"}], "how": ["3v9 = 3v6 + 6v9 首尾相接", "用 June 同 Sept 期貨隱含利率滾存", "對沖：每段各自用對應月份期貨（sell 10 June + 10 Sept）"], "facts": ["不完全對沖原因：標準金額、90 vs 91/92 日、FRA 折現期貨唔折現、日期差少少"]}}, {"id": "3.13", "lec": "L3", "zh": "成交量同未平倉合約", "en": "Volume and open interest", "sl": [35], "idea": "<b>Volume<\/b> = 當日成交合約數；<b>open interest<\/b> = 已開倉但未平倉嘅合約數。價升 + 兩者都升 = 新資金入市、趨勢強。", "terms": [["volume", "成交量"], ["open interest", "未平倉合約"], ["close out", "平倉"]], "params": [], "steps": [{"c": "<b class=\"k1\">Volume<\/b>：當日總共成交幾多張合約。", "f": "<b class=\"k1\">Volume<\/b> = total contracts traded during the day"}, {"c": "<b class=\"k2\">Open interest<\/b>：開咗倉但未平（未 reverse / close out）嘅合約數。", "f": "<b class=\"k2\">Open interest<\/b> = purchases not yet reversed or closed out"}, {"c": "價升，同時 volume 同 open interest 都升 → <b class=\"k3\">新資金入市，趨勢強<\/b>。", "f": "Price ↑ + volume ↑ + OI ↑ → <b class=\"k3\">new money, strong trend<\/b>"}, {"c": "Open interest 跌 → <b class=\"k4\">有人平倉，趨勢減弱<\/b>。", "f": "OI ↓ → <b class=\"k4\">positions closing out, trend weakening<\/b>"}], "tips": [], "mc": [{"q": "Open interest is:", "o": ["Contracts traded today", "Contracts opened and not yet closed out", "The exchange's interest income"], "a": 1, "why": "未平倉合約數。"}, {"q": "Futures price, volume and open interest are all rising. This suggests:", "o": ["New money entering, a strong trend", "Positions closing, a weakening trend"], "a": 0, "why": "新倉增加 + 成交活躍 = 趨勢強。"}, {"q": "Open interest is falling. This suggests:", "o": ["New buyers entering", "Positions are being closed out"], "a": 1, "why": "未平倉減少 = 有人平倉。"}], "sheet": {"facts": ["Volume = 當日成交張數", "Open interest = 未平倉合約", "價 ↑ + 成交 ↑ + OI ↑ → 新錢入市，趨勢強", "OI ↓ → 有人平倉，趨勢減弱"]}}, {"id": "3.14", "lec": "L3", "zh": "FRA vs 期貨套利", "en": "Arbitrage between FRAs and futures", "sl": [37], "idea": "將期貨價轉做利率（100 − price），同 FRA 報價比較。揀<b>相反方向<\/b>：<b>買 FRA（俾固定）+ 買期貨（鎖定收固定）<\/b>，差價穩賺。", "terms": [["arbitrage", "套利"], ["must-win strategy", "穩賺策略"], ["implied rate", "隱含利率"]], "params": [{"l": "2v5 FRA offer", "v": "7.27%"}, {"l": "期貨 offer 價", "v": "92.68"}], "steps": [{"c": "報價：2v5 FRA 7.22 / <b class=\"k1\">7.27%<\/b>；3 個月期貨 92.67 / <b class=\"k2\">92.68<\/b>（2 個月後交收）。", "f": "FRA 7.22 / <b class=\"k1\">7.27%<\/b> · futures 92.67 / <b class=\"k2\">92.68<\/b>"}, {"c": "期貨轉做利率：買期貨用 offer 92.68 → 鎖定收 <b class=\"k2\">7.32%<\/b>。", "f": "Buy futures at 92.68 → lock in receiving <b class=\"k2\">7.32%<\/b>"}, {"c": "買 FRA 用 offer → 俾固定 <b class=\"k1\">7.27%<\/b>。兩個倉方向相反，LIBOR 點變都抵銷。", "f": "Buy FRA: gain (L − 7.27%) · Buy futures: gain (7.32% − L)"}, {"c": "淨利潤（<b class=\"k3\">綠色<\/b>）：", "f": "Locked-in = 7.32% − 7.27% = <b class=\"k3\">5 bp<\/b> · on $10m for 90 days = <b class=\"k3\">$1,250.00<\/b>"}], "tips": [], "mc": [{"q": "FRA 4.10/4.15%; futures 95.80/95.81. Riskless profit on $10m for 90 days (ignore discounting)?", "o": ["$1,000", "$1,250", "$2,500", "$0"], "a": 0, "why": "期貨 offer 95.81 → 4.19%；買 FRA 4.15%：4bp × 10m × 90/360 = 1,000。"}, {"q": "A 2v5 FRA is quoted 7.22 / 7.27%. 3-month futures (delivery in 2 months) are quoted 92.67 / 92.68. The riskless strategy is to:", "o": ["Buy FRA and sell futures", "Buy FRA and buy futures", "Sell FRA and sell futures"], "a": 1, "why": "買 FRA 用 offer 7.27%（俾定息）；買期貨用 offer 92.68 → 7.32%（收）。兩邊方向相反互相抵銷，鎖定 7.32 − 7.27 = 5bp（slide 37）。"}, {"q": "Futures quoted 92.67 / 92.68 imply rates of:", "o": ["7.33% / 7.32%", "92.67% / 92.68%", "7.22% / 7.27%"], "a": 0, "why": "100 − price。"}], "sheet": {"f": [{"t": "套利利潤", "m": "Profit = (收嘅利率 − 俾嘅利率) × N × days / 360"}], "how": ["期貨價轉利率：100 − 價（offer 92.68 → 7.32%）", "FRA：買用 offer（俾）、賣用 bid（收）", "搵一對：<b>俾低嘅、收高嘅<\/b>", "買 FRA 7.27% + 買期貨 7.32% → 鎖定 5 bp"], "trap": ["期貨 offer 價高 = 利率低（次序調轉）", "賣 + 賣：收 7.22% 俾 7.33% → 蝕 11 bp"]}}, {"id": "4.1", "lec": "L4", "zh": "利率掉期係乜，同 FRA 比較", "en": "What an interest rate swap is, compared with an FRA", "sl": [1, 2, 3, 4, 5], "idea": "<b>Swap<\/b> = 兩邊交換兩條現金流（<b>legs<\/b>）。<b>IRS<\/b> = 交換利息，通常係定息換浮息。好似<b>一連串 FRA<\/b>，但每期喺<b>期尾<\/b>結算。", "terms": [["swap", "掉期"], ["leg", "交易腳（其中一方俾出嘅一串現金流）"], ["interest rate swap (IRS)", "利率掉期"], ["netted", "淨額結算"]], "params": [], "steps": [{"c": "Swap：兩個對手交換兩條現金流，每一條叫一條 <b class=\"k1\">leg<\/b>。IRS 就係交換利息。", "f": "Swap = exchange one stream of cash flows (<b class=\"k1\">leg<\/b>) for another · IRS = interest payments"}, {"c": "用 <b class=\"k2\">FRA<\/b> 對沖：只係鎖定<b>一段<\/b>時間嘅利率，期頭結算。", "f": "<b class=\"k2\">FRA<\/b>: one future period, settled at the start (discounted)"}, {"c": "用 <b class=\"k3\">IRS<\/b> 對沖：每 3 個月收 LIBOR、俾固定 swap rate，<b>一連串<\/b>時段都鎖定。", "f": "<b class=\"k3\">IRS<\/b>: receive LIBOR every 3 months, pay fixed swap rate · borrower pays LIBOR + margin to lender"}, {"c": "同 FRA 一樣：冇本金交換、只係利息互相抵銷（<b class=\"k4\">netted<\/b>）。唔同：每期喺<b>期尾<\/b>結算。", "f": "Same: no principal, interest <b class=\"k4\">netted<\/b> · Different: IRS settles at the <b class=\"k4\">end<\/b> of each period"}], "tips": [], "mc": [{"q": "In an interest rate swap, the principal is:", "o": ["Exchanged at the start and the end", "Not exchanged", "Exchanged every period"], "a": 1, "why": "同 FRA 一樣，本金係名義嘅。"}, {"q": "A key difference between an IRS and an FRA:", "o": ["An IRS settles at the end of each period; an FRA at the start", "An IRS exchanges principal", "An FRA covers many periods"], "a": 0, "why": "IRS 期尾結算；FRA 期頭結算（要折現）。"}, {"q": "A borrower paying LIBOR + margin hedges with an IRS by:", "o": ["Paying LIBOR, receiving fixed", "Receiving LIBOR, paying fixed"], "a": 1, "why": "收 LIBOR 抵銷貸款嘅 LIBOR，淨係俾固定 + margin。"}], "sheet": {"facts": ["Swap = 兩方定期交換現金流（legs）；IRS = 定息換浮息", "同 FRA：本金唔交換、只俾淨額", "唔同 FRA：IRS 每期<b>期尾<\/b>結算（唔折現）；FRA 期頭結算（要折現）", "借款人對沖：收 LIBOR、俾 swap rate → 淨 = swap rate + margin"], "f": [{"t": "借款人淨成本", "m": "Net = −(L + margin) + L − swap rate = −(swap rate + margin)"}]}}, {"id": "4.2", "lec": "L4", "zh": "比較優勢：點樣雙贏", "en": "Comparative advantage: creating a win-win", "sl": [6, 7, 8], "idea": "可以分嘅好處 = <b>定息差 − 浮息差<\/b>。每間公司借自己<b>相對<\/b>有優勢嗰種，然後用 swap 換返自己想要嘅。", "terms": [["comparative advantage", "比較優勢"], ["fixed / floating", "定息 / 浮息"], ["win-win", "雙贏"]], "params": [], "steps": [{"c": "A：定息 <b class=\"k1\">8.0%<\/b>、浮息 <b class=\"k1\">LIBOR + 0.1%<\/b>，想要浮息。B：定息 <b class=\"k2\">9.5%<\/b>、浮息 <b class=\"k2\">LIBOR + 0.8%<\/b>，想要定息。", "f": "A: fixed <b class=\"k1\">8.0%<\/b>, floating <b class=\"k1\">L + 0.1%<\/b> (wants floating) · B: fixed <b class=\"k2\">9.5%<\/b>, floating <b class=\"k2\">L + 0.8%<\/b> (wants fixed)"}, {"c": "比較差距：定息差 1.5%，浮息差得 0.7%。A 兩樣都平啲，但<b>定息<\/b>平得多。", "f": "Fixed gap = 9.5 − 8.0 = <b class=\"k3\">1.5%<\/b> · floating gap = 0.8 − 0.1 = <b class=\"k3\">0.7%<\/b>"}, {"c": "可分嘅好處（<b class=\"k4\">紫色<\/b>）：", "f": "Total gain = 1.5% − 0.7% = <b class=\"k4\">0.8%<\/b>"}, {"c": "A 借<b>定息<\/b> 8%、B 借<b>浮息<\/b> L + 0.8%；然後 swap：B 俾 A 8.3% 固定，A 俾 B LIBOR。", "f": "A borrows fixed 8.0% · B borrows L + 0.8% · swap: B pays A 8.3%, A pays B LIBOR"}, {"c": "結果：A 淨付 <b class=\"k1\">LIBOR − 0.3%<\/b>（慳 0.4%），B 淨付 <b class=\"k2\">9.1%<\/b>（慳 0.4%），加埋 = 0.8% ✓", "f": "A: −8.0 + 8.3 − L = <b class=\"k1\">L − 0.3%<\/b> · B: −(L + 0.8) + L − 8.3 = <b class=\"k2\">−9.1%<\/b> · 0.4 + 0.4 = <b class=\"k4\">0.8%<\/b>"}], "tips": [{"s": 7, "tip": "計淨成本：俾出用負號，收入用正號，LIBOR 一正一負抵銷。"}], "mc": [{"q": "A: fixed 5%, floating L + 0.2%. B: fixed 6.4%, floating L + 0.9%. Total saving available?", "o": ["1.4%", "0.7%", "0.5%", "2.1%"], "a": 1, "why": "定息差 1.4% − 浮息差 0.7% = 0.7%。"}, {"q": "A can borrow fixed at 8% or floating at LIBOR + 0.1%. B can borrow fixed at 9.5% or floating at LIBOR + 0.8%. Which company should borrow FIXED from the market?", "o": ["A", "B"], "a": 0, "why": "A 喺定息有較大優勢，所以 A 借定息再 swap。"}, {"q": "A borrows fixed at 8%; B borrows floating at LIBOR + 0.8%. In the swap, B pays A 8.3% fixed and A pays B LIBOR. B's net cost is:", "o": ["9.5%", "9.1%", "8.3%", "LIBOR + 0.8%"], "a": 1, "why": "−(L + 0.8) + L − 8.3 = −9.1%，慳 0.4%。"}], "sheet": {"f": [{"t": "總好處", "m": "Gain = (fixed 差) − (floating 差)"}, {"t": "淨成本", "m": "俾出用負號、收入用正號，加埋"}], "how": ["計定息差（9.5 − 8.0 = 1.5%）同浮息差（0.8 − 0.1 = 0.7%）", "總好處 = 1.5 − 0.7 = 0.8%", "差得大嗰邊（定息）由優勢方 A 借；B 借浮息", "Swap 換返：B 俾 A 定息 x，A 俾 B LIBOR"], "trap": ["A 兩樣都平都要 swap：睇<b>比較優勢<\/b>，唔係絕對優勢"]}}, {"id": "4.3", "lec": "L4", "zh": "Swap rate 點分好處", "en": "How the swap rate splits the gain", "sl": [9, 10, 11], "idea": "Swap 嘅固定利率 <b>x<\/b> 決定點分：A 淨付 <b>L − (x − 8%)<\/b>，B 淨付 <b>x + 0.8%<\/b>。總好處永遠 <b>0.8%<\/b>。", "terms": [["swap rate", "掉期利率"], ["net cost", "淨成本"], ["relative advantage", "相對優勢"]], "params": [{"l": "B 俾 A 嘅固定利率 x", "v": "8.30%"}], "steps": [{"c": "A 淨付（<b class=\"k1\">藍色<\/b>）：自己借 8%，收 x，俾 LIBOR。", "f": "A = −8.0% + <b class=\"k3\">8.30%<\/b> − L = <b class=\"k1\">LIBOR − 0.30%<\/b>"}, {"c": "B 淨付（<b class=\"k2\">橙色<\/b>）：自己借 L + 0.8%，收 LIBOR，俾 x。", "f": "B = −(L + 0.8%) + L − <b class=\"k3\">8.30%<\/b> = <b class=\"k2\">−9.10%<\/b>"}, {"c": "各自慳幾多（<b class=\"k4\">紫色<\/b>）：A 比 L + 0.1% 平；B 比 9.5% 平。", "f": "A saves <b class=\"k4\">0.40%<\/b> · B saves <b class=\"k4\">0.40%<\/b> · total <b class=\"k4\">0.80%<\/b>"}, {"c": "Slides 9–11：x = 8.5% → A 慳 0.6、B 慳 0.2；x = 8.3% → 0.4 / 0.4；x = 8.1% → 0.2 / 0.6。x 要喺 7.9% 至 8.7% 之間，兩邊先肯做。", "f": "x 8.5% → L − 0.5% / 9.3% · x 8.3% → L − 0.3% / 9.1% · x 8.1% → L − 0.1% / 8.9% · valid: 7.9% < x < 8.7%"}], "tips": [{"s": 11, "tip": "<b>Swap rate<\/b>（定息腳利率）越高，A 越著數；越低，B 越著數。但兩邊加埋總係 0.8%：swap rate 只決定<b>點分<\/b>，唔改變總好處。"}], "mc": [{"q": "A borrows fixed at 8%; B borrows floating at LIBOR + 0.8%. In the swap, B pays A 8.5% fixed and A pays B LIBOR. A's and B's net costs are:", "o": ["L − 0.3% and 9.1%", "L − 0.5% and 9.3%", "L − 0.1% and 8.9%"], "a": 1, "why": "A = L − (8.5 − 8) = L − 0.5%；B = 8.5 + 0.8 = 9.3%（slide 9）。"}, {"q": "Changing the swap's fixed rate changes:", "o": ["The total gain", "Only how the gain is split", "Neither"], "a": 1, "why": "總好處 0.8% 固定；x 只係決定點分。"}, {"q": "Company A: fixed 6%, floating L + 0.5%; B: fixed 7.5%, floating L + 1.2%. A borrows fixed, pays LIBOR to B, receives x. What x splits the gain equally?", "o": ["5.9%", "6.3%", "6.0%"], "a": 0, "why": "總好處 0.8%，各 0.4%：A = 6 + L − x = L + 0.1 → x = 5.9%。"}], "sheet": {"f": [{"t": "A 淨成本", "m": "A = −fixed<sub>A<\/sub> + x − L"}, {"t": "B 淨成本", "m": "B = −(L + m<sub>B<\/sub>) + L − x = −(m<sub>B<\/sub> + x)"}, {"t": "平分好處", "m": "每人慳 Gain / 2 → 解 x"}], "how": ["寫出 A 同 B 嘅淨成本", "同各自直接借比較 = 慳幾多", "兩個慳加埋 = 總好處（固定）", "平分：A 淨 = 直接浮息 − Gain/2，解 x"], "trap": ["x 越高 A 越著數；x 越低 B 越著數；總好處唔變", "唔好單睇一條 leg（例如 A 收 5.9% 俾 6%），要睇淨成本"]}}], "pages": {"L1": "https://claude.ai/artifact/KXV1zz3LykESFEBHXK3Ned", "L2": "https://claude.ai/artifact/XqAbSVXHJAqB3WT6KSsz5H", "L3": "https://claude.ai/artifact/NcCzK2faJ3wKsyb6Eu9mLy", "L4": "https://claude.ai/artifact/6nyJ3Bay2hk1Qna535QUsv"}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById("data").textContent);
const KPS=D.kps;                          /* [{id,lec,zh,en,idea,terms,params,steps,tips,mc,sheet}] */
const BY=Object.fromEntries(KPS.map(k=>[k.id,k]));
const LECS=[["L1","L1 基本金融算術"],["L2","L2 貨幣市場"],["L3","L3 FRA 同期貨"],["L4","L4 利率掉期"]];
const $=s=>document.querySelector(s);
const KEY="c7802-revise-v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
let S=Object.assign({rev:{},res:{},lec:"L1",last:null},load());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let view="home",cur=null,mode="rev",qi=0,answers={};

/* ---------- navigation with phone back button ---------- */
function push(v){try{if(!history.state||history.state.v!==v)history.pushState({v},"")}catch(e){}}
window.addEventListener("popstate",()=>{
  if(!$("#peek").hidden){closePeek();keep();return}
  if($("#sheet").classList.contains("open")){closeCalc();keep();return}
  if(view==="kp")home(true);
});
function keep(){if(view!=="home")try{history.pushState({v:view},"")}catch(e){}}

/* ---------- home ---------- */
function stat(k){const n=k.mc.length,r=k.mc.map((_,i)=>S.res[k.id+"#"+i]).filter(x=>x!=null),ok=r.filter(Boolean).length;return{n,done:r.length,ok}}
function badge(k){const s=stat(k);if(!s.done)return S.rev[k.id]?'<span class="badge rev">溫咗</span>':'<span class="badge none">未開始</span>';
  const c=s.ok===s.n?"ok":s.ok/s.n>=.6?"mid":"no";return `<span class="badge ${c}">${s.ok}/${s.n} 啱</span>`}
function home(fromPop){
  if(!fromPop&&history.state&&history.state.v!=="home"){history.back();return}
  view="home";cur=null;closeCalc();closePeek();$("#act").hidden=true;
  $("#brand").innerHTML='COMP7802 溫習<small>L1 – L4 · 公式 · 例子 · MC</small>';
  const ks=KPS.filter(k=>k.lec===S.lec);
  const last=S.last&&BY[S.last];
  $("#view").innerHTML=`<h1>揀一個知識點：先溫，再測</h1>
   <p class="lede">每個知識點有公式、計數步驟、例子同陷阱。溫完即刻做嗰個知識點嘅 MC，次序固定。</p>
   ${last?`<button class="kprow" type="button" id="resume" style="border-color:var(--accent);background:var(--accent-soft);margin-bottom:12px"><span class="id">${last.id}</span><span class="t"><b>繼續：${last.zh}</b><span>上次去到呢度</span></span><span class="st">›</span></button>`:""}
   <div class="tabs" role="tablist">${LECS.map(l=>`<button class="tab" role="tab" type="button" data-l="${l[0]}" aria-selected="${S.lec===l[0]}">${l[0]}</button>`).join("")}</div>
   <div class="lbl" style="font-size:13px;color:var(--muted);margin-bottom:8px">${LECS.find(l=>l[0]===S.lec)[1]}</div>
   <div class="kps">${ks.map(k=>`<button class="kprow" type="button" data-id="${k.id}"><span class="id">${k.id}</span><span class="t"><b>${k.zh}</b><span>${k.en}</span></span><span class="st">${badge(k)}<span>${k.mc.length} 題</span></span></button>`).join("")}</div>
   <button class="reset" id="reset" type="button">清除所有紀錄</button>`;
  $("#view").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{S.lec=b.dataset.l;save();home(true)}));
  $("#view").querySelectorAll(".kps .kprow").forEach(b=>b.addEventListener("click",()=>openKp(b.dataset.id,"rev")));
  if(last)$("#resume").addEventListener("click",()=>openKp(last.id,"rev"));
  let armed=false;$("#reset").addEventListener("click",e=>{if(!armed){armed=true;e.currentTarget.textContent="再撳一次確認清除";return}S={rev:{},res:{},lec:S.lec,last:null};save();home(true)});
  window.scrollTo(0,0);
}

/* ---------- knowledge point ---------- */
function openKp(id,m){cur=BY[id];mode=m||"rev";qi=0;answers={};view="kp";S.last=id;save();push("kp");render();window.scrollTo(0,0)}
function render(){
  $("#brand").innerHTML=`${cur.lec} · ${cur.id}<small>${cur.zh}</small>`;
  const s=stat(cur);
  $("#view").innerHTML=`<div class="kh"><div class="crumb">${cur.lec} · 知識點 ${cur.id} · slides ${cur.sl.join(", ")}</div><h2>${cur.zh}</h2><div class="en">${cur.en}</div></div>
   <div class="seg" role="tablist"><button type="button" role="tab" data-m="rev" aria-selected="${mode==="rev"}">📖 溫習</button><button type="button" role="tab" data-m="test" aria-selected="${mode==="test"}">✏️ 測驗 · ${cur.mc.length} 題</button></div>
   <div id="body"></div>`;
  $("#view").querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.m;if(mode==="test"){qi=0;answers={}}render();window.scrollTo(0,0)}));
  if(mode==="rev")renderRev($("#body"));else renderTest();
  renderAct();
}
function sheetHtml(k,compact){
  const sh=k.sheet||{};let h="";
  if(!compact)h+=`<div class="card"><h3>重點</h3><div class="idea">${k.idea}</div></div>`;
  if(sh.f&&sh.f.length)h+=`<div class="card"><h3>公式</h3>${sh.f.map(f=>`<div class="fm"><div class="ft">${f.t}</div><div class="fx">${f.m}</div>${f.v?`<div class="fv">${f.v}</div>`:""}</div>`).join("")}</div>`;
  if(sh.how&&sh.how.length)h+=`<div class="card"><h3>計數 / 解題步驟</h3><ol class="steps">${sh.how.map(x=>`<li><span>${x}</span></li>`).join("")}</ol></div>`;
  if(sh.facts&&sh.facts.length)h+=`<div class="card"><h3>要記</h3><ul class="facts">${sh.facts.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  const sl=k.sl.filter(n=>n!==1);
  if(sl.length)h+=`<div class="card"><h3>📄 你嘅筆記：slide ${sl.join(", ")}</h3><div class="slides">${sl.map(n=>`<button type="button" data-sl="${n}"><img src="${slideSrc(k,n)}" alt="${k.lec} slide ${n}" loading="lazy"><span>${k.lec} · slide ${n}</span></button>`).join("")}</div><p class="slhint">左右掃睇下一張；撳一下放大。下面例子嘅數字同 slide 一樣。</p></div>`;
  if(!compact&&k.steps.length)h+=`<div class="card"><h3>例子：逐步計（顏色對應公式）</h3>${k.params.length?`<div class="given">已知：${k.params.map(p=>`<span>${p.l} ${p.v}</span>`).join("")}</div>`:""}<div class="ex">${k.steps.map((s,i)=>`<div class="exs s${i}"><div class="c">${s.c}</div>${s.f?`<div class="f">${s.f}</div>`:""}</div>`).join("")}</div></div>`;
  const traps=(sh.trap||[]).concat((k.tips||[]).map(t=>t.tip));
  if(traps.length)h+=`<div class="card trap"><h3>⚠ 陷阱 / 考試位</h3><ul>${traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(!compact&&k.terms.length)h+=`<div class="card"><h3>英文用語</h3><div class="terms">${k.terms.map(t=>`<span><b>${t[0]}</b>${t[1]}</span>`).join("")}</div></div>`;
  if(!compact&&D.pages[k.lec])h+=`<a class="full" href="${D.pages[k.lec]}#k${k.id}" target="_blank" rel="noopener">▶ 開返 ${k.id} 嘅動畫溫習頁（有聲）↗</a>`;
  return h;
}
function slideSrc(k,n){return `slides/${k.lec.toLowerCase()}-${String(n).padStart(2,"0")}.jpg`}
function wireSlides(root,k){root.querySelectorAll(".slides button").forEach(b=>b.addEventListener("click",()=>lightbox(k,+b.dataset.sl)))}
function lightbox(k,n){const list=k.sl.filter(x=>x!==1);let i=list.indexOf(n);
  const lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");
  const draw=()=>{lb.innerHTML=`<div class="bar2"><span>${k.lec} · slide ${list[i]} （${i+1}/${list.length}）</span><button type="button" data-d="-1" ${i?"":"disabled"}>◀</button><button type="button" data-d="1" ${i<list.length-1?"":"disabled"}>▶</button><button type="button" data-x>✕</button></div><div class="pic"><img src="${slideSrc(k,list[i])}" alt="slide ${list[i]}"></div>`;
    lb.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{i+=+b.dataset.d;draw()}));lb.querySelector("[data-x]").addEventListener("click",close)};
  const close=()=>{lb.remove();document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight"&&i<list.length-1){i++;draw()}if(e.key==="ArrowLeft"&&i>0){i--;draw()}};
  let x0=null;lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(dx<-50&&i<list.length-1){i++;draw()}else if(dx>50&&i>0){i--;draw()}x0=null});
  document.addEventListener("keydown",key);draw();document.body.appendChild(lb)}
function renderRev(el){
  S.rev[cur.id]=1;save();
  el.innerHTML=sheetHtml(cur,false)+`<button class="btn pri go" id="goTest" type="button">溫完，開始測驗（${cur.mc.length} 題）→</button>`;
  wireSlides(el,cur);
  $("#goTest").addEventListener("click",()=>{mode="test";qi=0;answers={};render();window.scrollTo(0,0)});
}
function renderTest(){
  const el=$("#body"),n=cur.mc.length;
  if(qi>=n){return renderDone(el)}
  const m=cur.mc[qi],a=answers[qi],L="ABCDE";
  el.innerHTML=`<div class="prog"><i style="width:${(qi+1)/n*100}%"></i></div><div class="qn">第 ${qi+1} / ${n} 題</div>
   <p class="q">${m.q}</p>
   <div class="opts">${m.o.map((o,i)=>{let c="";if(a!=null){if(i===m.a)c="ok";else if(i===a)c="no"}return `<button class="opt ${c}" type="button" data-i="${i}" ${a!=null?"disabled":""}><span class="l">${L[i]}</span><span class="v">${o}</span></button>`}).join("")}</div>
   ${a!=null?`<div class="why ${a===m.a?"good":"bad"}"><div class="verdict">${a===m.a?"✓ 啱！":"✗ 唔啱。答案係 "+L[m.a]}</div>${m.why}</div>`:""}
   <button class="btn peek" id="peekB" type="button">📖 睇返公式同步驟</button>`;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.i)));
  $("#peekB").addEventListener("click",openPeek);
}
function pick(i){if(answers[qi]!=null)return;const m=cur.mc[qi];answers[qi]=i;S.res[cur.id+"#"+qi]=i===m.a;save();renderTest();renderAct();
  const w=document.querySelector(".why");if(w)w.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"})}
function renderDone(el){
  const n=cur.mc.length,ok=cur.mc.filter((m,i)=>answers[i]===m.a).length,wrong=cur.mc.map((m,i)=>[m,i]).filter(([m,i])=>answers[i]!=null&&answers[i]!==m.a);
  const idx=KPS.indexOf(cur),nx=KPS[idx+1];
  el.innerHTML=`<div class="card"><h3>${cur.id} 測驗結果</h3><div class="score">${ok} / ${n}</div>
   <p class="lede" style="margin:0">${ok===n?"全對！可以去下一個知識點。":"錯咗嘅題目：先睇返公式，再重做。"}</p></div>
   ${wrong.length?`<div class="card"><h3>錯咗</h3><div class="wrongs">${wrong.map(([m])=>`<div>${m.q}</div>`).join("")}</div></div>`:""}
   <div class="row">${wrong.length?'<button class="btn" id="again" type="button">↻ 再做一次</button><button class="btn" id="back2" type="button">📖 返去溫習</button>':""}${nx?`<button class="btn pri" id="nextKp" type="button">下一個：${nx.id} ${nx.zh} →</button>`:""}</div>`;
  if(wrong.length){$("#again").addEventListener("click",()=>{qi=0;answers={};renderTest();renderAct();window.scrollTo(0,0)});$("#back2").addEventListener("click",()=>{mode="rev";render();window.scrollTo(0,0)})}
  if(nx)$("#nextKp").addEventListener("click",()=>{if(nx.lec!==S.lec){S.lec=nx.lec;save()}openKp(nx.id,"rev")});
}

/* bottom bar changes with the mode */
function renderAct(){
  $("#act").hidden=false;const r=$("#actRow");
  const idx=KPS.indexOf(cur),pv=KPS[idx-1],nx=KPS[idx+1];
  if(mode==="rev"){
    r.innerHTML=`<button class="btn" id="aHome" type="button" aria-label="返去目錄">☰</button><button class="btn" id="aPrevK" type="button" ${pv?"":"disabled"} aria-label="上一個知識點">◀</button><button class="btn" id="aCalc" type="button">🧮</button><button class="btn pri" id="aTest" type="button">去測驗 ✏️</button>`;
    $("#aPrevK").addEventListener("click",()=>pv&&openKp(pv.id,"rev"));
    $("#aTest").addEventListener("click",()=>{mode="test";qi=0;answers={};render();window.scrollTo(0,0)});
  }else{
    const done=qi>=cur.mc.length;
    r.innerHTML=`<button class="btn" id="aHome" type="button" aria-label="返去目錄">☰</button><button class="btn" id="aPrev" type="button" ${qi>0&&!done?"":"disabled"} aria-label="上一題">◀</button><button class="btn" id="aCalc" type="button">🧮</button><button class="btn pri" id="aNext" type="button" ${done?"disabled":""}>${qi===cur.mc.length-1?"完成 ✓":"下一題 ▶"}</button>`;
    $("#aPrev").addEventListener("click",()=>{if(qi>0){qi--;renderTest();renderAct();window.scrollTo(0,0)}});
    $("#aNext").addEventListener("click",()=>{qi++;renderTest();renderAct();window.scrollTo(0,0)});
  }
  $("#aHome").addEventListener("click",()=>home());
  $("#aCalc").addEventListener("click",toggleCalc);
  if($("#sheet").classList.contains("open"))openCalc();
}

/* cheat overlay while testing */
function openPeek(){const p=$("#peek");p.innerHTML=`<div class="wrap"><div class="peekhead"><b>${cur.id} ${cur.zh} · 公式</b><button class="iconb" id="peekX" type="button">✕ 返去題目</button></div>${sheetHtml(cur,true)}</div>`;p.hidden=false;p.scrollTop=0;wireSlides(p,cur);$("#peekX").addEventListener("click",()=>{closePeek();try{history.back()}catch(e){}});try{history.pushState({v:"peek"},"")}catch(e){}}
function closePeek(){$("#peek").hidden=true}

/* ---------- calculator ---------- */
let expr="",ans=0,tape=[],justCalc=false; /* justCalc: an operator typed right after = continues from the answer */
const KEYS=[
 ["(","op","("],[")","op",")"],["xʸ","op fn","^"],["√","op fn","sqrt("],["ln","op fn","ln("],["eˣ","op fn","exp("],
 ["7","","7"],["8","","8"],["9","","9"],["÷","op","÷"],["⌫","op","DEL"],["AC","op","AC"],
 ["4","","4"],["5","","5"],["6","","6"],["×","op","×"],["÷360","op fn","÷360"],["÷365","op fn","÷365"],
 ["1","","1"],["2","","2"],["3","","3"],["−","op","−"],["%","op fn","%"],["1/x","op fn","1/x"],
 ["0","","0"],[".","","."],["ANS","op fn","ANS"],["+","op","+"],["=","eq w2","="]
];
$("#keys").innerHTML=KEYS.map(k=>`<button type="button" class="${k[1]}" data-v="${k[2]}">${k[0]}</button>`).join("");
$("#keys").addEventListener("click",e=>{const b=e.target.closest("button");if(b)press(b.dataset.v)});
function press(v){
  const cont=justCalc;justCalc=false;
  if(v==="AC"){expr="";$("#cRs").className="rs";$("#cRs").textContent="0";$("#cEx").textContent="";return}
  if(v==="DEL"){expr=expr.replace(/(sqrt\(|ln\(|exp\(|ANS|÷360|÷365|.)$/,"");calcShow(true);return}
  if(v==="="){calc();return}
  if(v==="÷360"||v==="÷365"){expr=(expr||"ANS")+v;calcShow(true);return}
  if(v==="1/x"){expr="1÷("+(expr||"ANS")+")";calcShow(true);return}
  if(/^[+−×÷^%]$/.test(v)&&expr===""&&cont)expr="ANS";
  expr+=v;calcShow(true);
}
function fmt(x){if(!isFinite(x))return "錯誤";const a=Math.abs(x);if(a!==0&&(a<1e-6||a>=1e15))return x.toExponential(8);return x.toLocaleString("en-US",{maximumFractionDigits:8})}
function calcShow(live){$("#cEx").textContent=expr;if(!live)return;try{const r=evaluate(expr);$("#cRs").className="rs";$("#cRs").textContent=expr?fmt(r):"0"}catch(e){}}
function calc(){
  if(!expr)return;
  try{const r=evaluate(expr);if(!isFinite(r))throw new Error("計唔到（例如除咗 0）");ans=r;tape.unshift({e:expr,r});tape=tape.slice(0,8);justCalc=true;$("#cEx").textContent=expr+" =";$("#cRs").className="rs";$("#cRs").textContent=fmt(r);expr="";drawTape()}
  catch(e){$("#cRs").className="rs err";$("#cRs").textContent=e.message||"算式有錯"}
}
function drawTape(){$("#tape").innerHTML=tape.map((t,i)=>`<button type="button" data-i="${i}">${fmt(t.r)}</button>`).join("");
  $("#tape").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{expr+="("+tape[+b.dataset.i].r+")";calcShow(true)}))}
/* recursive-descent parser: + − × ÷ ^ %, unary minus, sqrt/ln/exp, ANS, implicit closing brackets and implicit multiplication */
function evaluate(src){
  let s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  const open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;if(open>0)s+=")".repeat(open);
  let i=0;const peek=()=>s[i],eat=c=>{if(s[i]===c){i++;return true}return false};
  function num(){const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));if(!m)throw new Error("算式有錯");i+=m[0].length;return parseFloat(m[0])}
  function prim(){
    if(eat("(")){const v=add();if(!eat(")"))throw new Error("括號唔夾");return v}
    for(const [n,f] of [["sqrt(",Math.sqrt],["ln(",Math.log],["exp(",Math.exp]]){if(s.startsWith(n,i)){i+=n.length;const v=add();eat(")");return f(v)}}
    if(s.startsWith("ANS",i)){i+=3;return ans}
    return num();
  }
  function post(){let v=prim();while(peek()==="%"){i++;v/=100}
    while(peek()==="("||["sqrt(","ln(","exp(","ANS"].some(n=>s.startsWith(n,i))){v*=prim()}
    return v}
  function unary(){if(eat("-"))return -unary();if(eat("+"))return unary();return post()}
  function pow(){const b=unary();if(eat("^"))return Math.pow(b,pow());return b}
  function mul(){let v=pow();for(;;){if(eat("*"))v*=pow();else if(eat("/"))v/=pow();else return v}}
  function add(){let v=mul();for(;;){if(eat("+"))v+=mul();else if(eat("-"))v-=mul();else return v}}
  if(!s)return 0;const v=add();if(i<s.length)throw new Error("算式有錯");return v;
}
function openCalc(){const act=$("#act"),sh=$("#sheet");const ah=act.hidden?0:act.offsetHeight;sh.style.bottom=ah+"px";sh.style.paddingBottom=act.hidden?"":"0px";sh.classList.add("open");
  document.querySelector("main .wrap").style.paddingBottom=(sh.offsetHeight+ah+20)+"px";try{history.pushState({v:"calc"},"")}catch(e){}}
function closeCalc(){$("#sheet").classList.remove("open");const w=document.querySelector("main .wrap");if(w)w.style.paddingBottom=""}
function toggleCalc(){if($("#sheet").classList.contains("open")){closeCalc();try{history.back()}catch(e){}}else openCalc()}
$("#calcTop").addEventListener("click",toggleCalc);
$("#closeC").addEventListener("click",()=>{closeCalc();try{history.back()}catch(e){}});
$("#useB").addEventListener("click",e=>{const t=$("#cRs").textContent,b=e.currentTarget;try{navigator.clipboard.writeText(t).then(()=>{b.textContent="已複製";setTimeout(()=>b.textContent="複製答案",1200)},()=>{})}catch(err){}});
document.addEventListener("keydown",e=>{
  if(!$("#sheet").classList.contains("open"))return;
  const m={"*":"×","/":"÷","-":"−","Enter":"=","=":"=","Backspace":"DEL","Escape":"AC"};
  if(/^[0-9.+()^%]$/.test(e.key)){press(e.key);e.preventDefault()}
  else if(m[e.key]){press(m[e.key]);e.preventDefault()}
});
