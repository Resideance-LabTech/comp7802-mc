<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Noto+Sans+HK:wght@400;600;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one column. Home = knowledge-point list by lecture. Point = cheat sheet (revise) then its MCs (test). Calculator = bottom sheet above the action bar. */
:root{
  --bg:#eef0ec; --surface:#fbfbf8; --ink:#1c2321; --muted:#5d6762; --line:#d5d9d3;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dfe9f1;
  --good:#1e7a4c; --good-soft:#dcefe3; --bad:#b2402f; --bad-soft:#f6e0db; --warn:#94620c; --warn-soft:#f6ecd6;
  --key:#e3e6e0; --key-op:#cfd8de; --key-eq:#1f5f8b; --lcd:#dfe5d6; --lcd-ink:#1b2a1e; --formula:#f2f4ee;
  --k1:#2563c9; --k2:#c25e10; --k3:#18804a; --k4:#8a3fb0;
  --display:"Archivo","Noto Sans HK",system-ui,sans-serif;
  --body:"Noto Sans HK",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe7; --muted:#9aa59f; --line:#323b37;
  --accent:#6fb0dc; --accent-ink:#0e1a22; --accent-soft:#1d3342;
  --good:#5cc48d; --good-soft:#163526; --bad:#ee8b78; --bad-soft:#3d201a; --warn:#e3b45c; --warn-soft:#3a2d12;
  --key:#2a322e; --key-op:#2f3d46; --key-eq:#6fb0dc; --lcd:#1f2b22; --lcd-ink:#cfe8cf; --formula:#18201c;
  --k1:#7aa8f0; --k2:#f0a060; --k3:#5cc48d; --k4:#c58ae0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#e6ebe7; --muted:#9aa59f; --line:#323b37;
  --accent:#6fb0dc; --accent-ink:#0e1a22; --accent-soft:#1d3342;
  --good:#5cc48d; --good-soft:#163526; --bad:#ee8b78; --bad-soft:#3d201a; --warn:#e3b45c; --warn-soft:#3a2d12;
  --key:#2a322e; --key-op:#2f3d46; --key-eq:#6fb0dc; --lcd:#1f2b22; --lcd-ink:#cfe8cf; --formula:#18201c;
  --k1:#7aa8f0; --k2:#f0a060; --k3:#5cc48d; --k4:#c58ae0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.k1{color:var(--k1);font-weight:700}.k2{color:var(--k2);font-weight:700}.k3{color:var(--k3);font-weight:700}.k4{color:var(--k4);font-weight:700}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis}
.iconb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
main .wrap{padding-block:16px 150px}

/* home */
h1{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kps{display:grid;gap:8px}
.kprow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.kprow .id{font-family:var(--mono);font-weight:700;color:var(--accent);width:38px;flex:0 0 auto}
.kprow .t{flex:1;min-width:0}
.kprow .t b{display:block;font-weight:700;line-height:1.35}
.kprow .t span{font-size:12px;color:var(--muted)}
.kprow .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.badge{border-radius:6px;padding:1px 7px;font-size:11px;font-family:var(--body);font-weight:600}
.badge.rev{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.mid{background:var(--warn-soft);color:var(--warn)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.badge.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.reset{margin-top:20px;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:0}

/* point header + mode switch */
.kh .crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.kh h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.kh .en{color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px;margin:12px 0 16px}
.seg button{border:0;border-radius:9px;padding:9px;background:transparent;font-weight:700;font-size:15px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* cheat sheet */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.idea{font-size:16.5px;line-height:1.7}
.idea b{color:var(--accent)}
.fm{background:var(--formula);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fm:last-child{margin-bottom:0}
.fm .ft{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fm .fx{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.75;white-space:normal;overflow-wrap:anywhere}
.fm .fv{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;line-height:1.6}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;margin-top:2px}
.ex{display:grid;gap:10px}
.exs{border-left:3px solid var(--line);padding-left:12px}
.exs .c{line-height:1.65}
.exs .f{font-family:var(--mono);font-size:14px;line-height:1.7;background:var(--formula);border-radius:8px;padding:6px 10px;margin-top:4px;white-space:normal;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.exs.s0{border-color:var(--k1)}.exs.s1{border-color:var(--k2)}.exs.s2{border-color:var(--k3)}.exs.s3,.exs.s4{border-color:var(--k4)}
.given{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.7}
.given span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:2px 4px 2px 0;font-family:var(--mono);font-size:12px}
ul.facts{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.65}
ul.facts b{color:var(--accent)}
.trap{background:var(--warn-soft);border-color:transparent}
.trap h3{color:var(--warn)}
.trap ul{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.65}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.terms span{background:var(--accent-soft);border-radius:6px;padding:3px 9px;font-size:13.5px}
.terms span b{font-family:var(--mono);color:var(--accent);margin-right:5px;font-weight:600}
.go{display:block;width:100%;margin-top:4px}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -2px}
.slides button{flex:0 0 86%;max-width:420px;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;padding:0;background:#fff;overflow:hidden;position:relative}
.slides img{display:block;width:100%;height:auto;aspect-ratio:4/3}
.slides span{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:11px;background:rgba(20,25,23,.75);color:#fff;border-radius:5px;padding:1px 6px}
.slhint{font-size:13px;color:var(--muted);margin:6px 0 0}
.full{display:inline-block;margin-top:8px;font-size:14px;color:var(--accent)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,12,11,.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px))}
.lb .bar2{display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--mono);font-size:13px}
.lb .bar2 span{flex:1}
.lb .bar2 button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:9px;padding:6px 12px}
.lb .pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px}

/* test */
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qn{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.q{font-size:17.5px;line-height:1.55;margin:0 0 14px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:52px}
.opt .l{font-family:var(--mono);font-weight:700;color:var(--muted);flex:0 0 auto;width:18px}
.opt .v{min-width:0;font-variant-numeric:tabular-nums}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ok .l{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-radius:12px;padding:12px 14px;line-height:1.7;background:var(--surface);border:1px solid var(--line)}
.why .verdict{font-weight:800;margin-bottom:4px}
.why.good .verdict{color:var(--good)}.why.bad .verdict{color:var(--bad)}
.why b{color:var(--accent)}
.peek{margin-top:10px;font-size:14px}
.score{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wrongs{display:grid;gap:6px}
.wrongs div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}

/* cheat overlay during test */
.peekpanel{position:fixed;inset:0;z-index:9;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.peekpanel .wrap{padding-block:12px 40px}
.peekhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:1}
.peekhead b{flex:1;font-family:var(--display)}

/* action bar */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.act .wrap{display:flex;gap:8px;padding-block:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act .btn.pri{flex:1}
.btn[disabled]{opacity:.4;cursor:default}
@media (max-width:380px){.act .btn{padding:12px 10px}}

/* calculator */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet:not(.open){bottom:0!important}
.sheet .wrap{padding-block:10px 12px}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh-top b{font-family:var(--display);font-size:15px;flex:1}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:8px 12px;font-family:var(--mono);min-height:68px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.lcd .ex{font-size:14px;opacity:.75;word-break:break-all;min-height:20px}
.lcd .rs{font-size:24px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.lcd .rs.err{font-size:14px;font-weight:600}
.tape{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.tape button{flex:0 0 auto;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.keys button{border:0;border-radius:9px;background:var(--key);padding:0;height:44px;font-family:var(--mono);font-size:16px;font-weight:600}
.keys .op{background:var(--key-op)}
.keys .fn{font-size:13px}
.keys .eq{background:var(--key-eq);color:var(--accent-ink)}
.keys .w2{grid-column:span 2}
.keys button:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){.sheet,.prog i{transition:none}}
@media (max-width:380px){.keys button{height:40px;font-size:15px}.q{font-size:17px}}
</style>

ed for 31 days at 0.25% (ACT/365). Interest at maturity?", "o": ["HK$212.33", "HK$2,500.00", "HK$208.33", "HK$2,250.68"], "a": 0, "why": "1,000,000 × 0.25/100 × 31/365 = 212.33。HK$2,250.68 係舊 screenshot 用 2.65% 計。"}, {"q": "HKD money-market deals use which day count?", "o": ["ACT/360", "ACT/365", "30/360"], "a": 1, "why": "港幣、英鎊、星加坡元用 ACT/365；美金、歐元用 ACT/360。"}, {"q": "Interest on HK$250,000 at 3.5% p.a. simple interest for 73 days (ACT/365)?", "o": ["HK$1,750.00", "HK$1,774.31", "HK$8,750.00", "HK$1,725.69"], "a": 0, "why": "港幣用 365：250,000 × 0.035 × 73/365 = 1,750。HK$1,774.31 係錯用 360 日。"}], "sheet": {"f": [{"t": "利息 Interest", "m": "Interest = P × i × days / year", "v": "P = 本金 principal · i = 年利率 · days = 實際日數 · year = 360 或 365"}, {"t": "到期總額 FV", "m": "FV = P × (1 + i × days / year)"}], "how": ["數實際日數（ACT），唔好當一個月 = 30 日", "揀分母：USD / EUR 用 360；HKD / GBP / SGD 用 365", "利率 % 轉小數：4% → 0.04", "代入：P × i × days/year 就係利息；加返本金就係 FV"], "trap": ["報價永遠係<b>年利率<\/b>：「10% for 6 months」= 半年大約 5%", "HKD 用 365，USD 用 360，用錯差好多"]}}, {"id": "1.2", "lec": "L1", "zh": "複利", "en": "Compound interest", "sl": [3, 21], "idea": "利息<b>再投資<\/b>，下一年連利息一齊再賺息，所以用<b>次方<\/b>：Principal × (1 + i)<sup>N<\/sup>。", "terms": [["compound interest", "複利"], ["reinvest", "再投資"], ["interest on interest", "利息嘅利息"]], "params": [{"l": "本金 Principal", "v": "$100"}, {"l": "年利率 rate", "v": "4.00%"}, {"l": "年數 years", "v": "2 yr"}], "steps": [{"c": "Year 0：本金 <b class=\"k1\">$100<\/b>。", "f": "Year 0: <b class=\"k1\">$100.00<\/b>"}, {"c": "第 1 年：賺 <b class=\"k3\">利息 $4.00<\/b>，同單利一樣。", "f": "Year 1: <b class=\"k1\">100<\/b> × (1 + 0.0400) = $104.00"}, {"c": "第 2 年：連埋上年嘅利息一齊再賺 → 多咗 <b class=\"k4\">利息嘅利息 $0.16<\/b>。", "f": "Year 2: 104.00 × 1.0400 = $108.16   (simple would give $108.00)"}, {"c": "2 年就乘 2 次：<b>Principal × (1 + i)<sup>N<\/sup><\/b>。", "f": "FV = <b class=\"k1\">100<\/b> × (1.0400)^2 = <b>$108.16<\/b>"}], "tips": [{"s": 3, "tip": "一年以上通常用複利；年期越長、利率越高，複利同單利差得越遠。"}], "mc": [{"q": "$100 at 4% compounded annually for 2 years. FV?", "o": ["$108.00", "$108.16", "$104.16", "$108.24"], "a": 1, "why": "100 × 1.04² = 108.16。$108 係單利。"}, {"q": "$1,000 at 5% compounded annually for 3 years. FV?", "o": ["$1,150.00", "$1,157.63", "$1,050.00", "$1,162.50"], "a": 1, "why": "1000 × 1.05³ = 1,157.63。"}, {"q": "On $100 at 4% for 2 years, compound beats simple by:", "o": ["$0.00", "$0.16", "$4.00", "$0.32"], "a": 1, "why": "多出嚟嘅 0.16 就係第一年利息 $4 再賺 4% 嘅利息。"}, {"q": "$5,000 invested at 6% compounded annually for 4 years. FV?", "o": ["$6,200.00", "$6,312.38", "$6,691.13", "$6,000.00"], "a": 1, "why": "5,000 × 1.06⁴ = 5,000 × 1.262477 = 6,312.38。$6,200 係單利 (5,000 + 4 × 300)。"}], "sheet": {"f": [{"t": "複利 FV", "m": "FV = P × (1 + i)<sup>n<\/sup>", "v": "n = 年數；唔係整數年就用 n = days / 365"}], "how": ["一年複利一次：每過一年乘一次 (1 + i)", "n 年就係 (1 + i) 嘅 n 次方", "計數機：1.04 ^ 2 × 100"], "trap": ["單利 $100 × 4% × 2 = $108；複利 $108.16。多出嘅 0.16 = 利息嘅利息"]}}, {"id": "1.3", "lec": "L1", "zh": "名義利率 vs 實際利率", "en": "Nominal vs effective rate", "sl": [4, 5, 6, 7], "idea": "<b>Nominal<\/b> = 報價年利率；<b>effective<\/b> = 將期內利息再投資之後，一年真正賺幾多。一年複利 n 次。", "terms": [["nominal rate", "名義利率"], ["effective rate", "實際利率"], ["compounding period", "複利期"], ["quarterly", "每季"], ["equivalent rate", "等值利率"]], "params": [{"l": "名義利率 nominal", "v": "4.00%"}, {"l": "每年複利次數 n", "v": 4}], "steps": [{"c": "將一年分成 <b class=\"k2\">4 期<\/b>，每期利率 = <b class=\"k1\">nominal<\/b> ÷ n。", "f": "Rate per period = <b class=\"k1\">4.00%<\/b> / <b class=\"k2\">4<\/b> = 1.0000%"}, {"c": "每期嘅利息都再投資，所以滾 4 次（<b class=\"k3\">綠色樓梯<\/b>）。", "f": "Growth in 1 year = (1 + 0.010000)^<b class=\"k2\">4<\/b> = <b class=\"k3\">1.040604<\/b>"}, {"c": "一年真正賺嘅就係 <b class=\"k4\">effective rate<\/b>，比 <b class=\"k1\">nominal<\/b> 高（虛線係唔再投資嘅情況）。", "f": "Effective = 1.040604 − 1 = <b class=\"k4\">4.0604%<\/b>   vs nominal <b class=\"k1\">4.00%<\/b>"}, {"c": "倒轉計都得：知道 effective，求 nominal。考試常見：「5% 一年派一次，等於每季複利幾多？」", "f": "Nominal = 4 × [(1 + 0.040604)^(1/4) − 1] = <b class=\"k1\">4.0000%<\/b>"}], "tips": [{"s": 5, "tip": "複利越密，effective 越高；反過嚟，要達到同一個 effective，複利越密，nominal 就可以越低。"}], "mc": [{"q": "8% nominal compounded monthly. Effective annual rate?", "o": ["8.00%", "8.24%", "8.30%", "8.33%"], "a": 2, "why": "(1 + 0.08/12)^12 − 1 = 8.30%。"}, {"q": "A 1-year deposit pays 5% at maturity. What nominal rate, compounded quarterly, gives the same return?", "o": ["5.000%", "4.909%", "5.095%", "1.250%"], "a": 1, "why": "4 × (1.05^(1/4) − 1) = 4.909%（slide 6）。複利越密，nominal 要越低。"}, {"q": "4% p.a. paid quarterly and reinvested. Effective rate?", "o": ["4.00%", "4.06%", "4.16%", "1.00%"], "a": 1, "why": "1.01⁴ − 1 = 4.06%（slide 5）。"}, {"q": "Two deposits give exactly the same money after 1 year. One pays interest once a year; the other compounds monthly. Which quoted nominal rate is lower?", "o": ["The annual-pay rate", "The monthly-compounded rate", "They are equal"], "a": 1, "why": "每月複利會賺利息嘅利息，所以要達到同一結果，報價利率可以低啲。"}, {"q": "6% nominal, compounded semi-annually. Effective annual rate?", "o": ["6.00%", "6.09%", "6.17%", "3.00%"], "a": 1, "why": "(1 + 0.06/2)² − 1 = 1.03² − 1 = 6.09%。"}, {"q": "12% nominal, compounded monthly. Effective annual rate?", "o": ["12.0000%", "12.3600%", "12.6825%", "12.5509%"], "a": 2, "why": "(1 + 0.12/12)¹² − 1 = 1.01¹² − 1 = 12.6825%。12.36% 係每半年複利。"}, {"q": "What nominal rate, compounded monthly, gives the same return as 6% compounded annually?", "o": ["5.8411%", "6.0000%", "6.1678%", "0.5000%"], "a": 0, "why": "12 × (1.06^(1/12) − 1) = 12 × 0.004868 = 5.8411%。複利越密，nominal 要越低先得同一個結果。"}], "sheet": {"f": [{"t": "名義 → 實際", "m": "effective = (1 + nominal / n)<sup>n<\/sup> − 1", "v": "n = 一年複利次數：半年 2、季 4、月 12、日 365"}, {"t": "實際 → 名義（等值利率）", "m": "nominal = n × [ (1 + effective)<sup>1/n<\/sup> − 1 ]"}], "how": ["問「effective / 實際」→ 用第一條", "問「quarterly / monthly equivalent」→ 用第二條，effective 係原本嗰個年利率（例如 5% 到期一次過）", "次方 1/n：計數機打 ^ ( 1 ÷ 4 )"], "trap": ["複利越密，effective 越高；同一個 effective，複利越密 nominal 越低", "5% 到期一次過嘅季度等值 = 4.909%（細過 5% 1 = 1.014795^4.0556 − 1 = 6.1370%。"}], "sheet": {"f": [{"t": "Compound yield / 年複利等值", "m": "(1 + i × days / year)<sup>year / days<\/sup> − 1", "v": "i = 短期報價（單利）· days = 投資日數"}], "how": ["先計一期增長：1 + i × days/365", "再次方 365/days（一年有幾多期）", "減 1 就係答案"], "trap": ["次方係 <b>year/days<\/b>（例如 365/153），唔係 days/year", "答案一定高過原本報價（因為滾存）"]}}, {"id": "1.5", "lec": "L1", "zh": "每日複利同連續複利", "en": "Daily and continuous compounding", "sl": [13, 14, 15, 21], "idea": "同一個年回報，<b>複利越密，報價利率越低<\/b>。極限就係連續複利：<b>r = ln(1 + i)<\/b>，而 <b>FV = PV × e<sup>r × days/year<\/sup><\/b>。", "terms": [["daily compounding", "每日複利"], ["continuous compounding", "連續複利"], ["natural logarithm (ln)", "自然對數"], ["exponential (e)", "指數 e"]], "params": [{"l": "年利率 annual i", "v": "9.3%"}], "steps": [{"c": "一年派一次息 (n = 1)：報價就係 <b class=\"k1\">9.30%<\/b>。", "f": "Annual (n = 1): <b class=\"k1\">9.3000%<\/b>"}, {"c": "要同一個年回報，半年、每季、每月複利嘅報價利率逐步降低（<b class=\"k2\">橙色<\/b>）。", "f": "r = n × [(1 + 0.093)^(1/n) − 1] → n=2: 9.093%, n=4: 8.992%, n=12: <b class=\"k2\">8.926%<\/b>"}, {"c": "每日複利 n = 365（<b class=\"k3\">綠色<\/b>）。", "f": "Daily: 365 × [(1 + 0.093)^(1/365) − 1] = <b class=\"k3\">8.8937%<\/b>"}, {"c": "n 去到無限大 = <b class=\"k4\">連續複利<\/b>，最低。倒返轉：i = e<sup>r<\/sup> − 1。", "f": "Continuous: r = ln(1 + 0.093) = <b class=\"k4\">8.8926%<\/b>    and   i = e^r − 1"}], "tips": [{"s": 15, "tip": "同一個實際回報：annual > semi-annual > quarterly > monthly > daily > continuous（報價由高到低）。"}], "mc": [{"q": "Continuously compounded equivalent of 6% annual?", "o": ["6.0000%", "5.8269%", "6.1837%", "5.9126%"], "a": 1, "why": "ln(1.06) = 5.8269%。5.9126% 係半年複利。"}, {"q": "A continuously compounded rate of 10% equals what annual rate?", "o": ["10.0000%", "9.5310%", "10.5171%", "11.0000%"], "a": 2, "why": "i = e^0.10 − 1 = 10.5171%。"}, {"q": "Four quotes all give the same effective annual return of 9.3%: compounded annually, monthly, daily and continuously. Which quoted rate is the LOWEST?", "o": ["Annual", "Monthly", "Daily", "Continuous"], "a": 3, "why": "複利越密，報價越低；連續複利最低（8.8926%）。"}, {"q": "Continuously compounded equivalent of 8% compounded annually?", "o": ["8.0000%", "8.3287%", "7.6961%", "7.8461%"], "a": 2, "why": "r = ln(1.08) = 7.6961%。連續複利報價一定低過年複利。"}, {"q": "5% continuously compounded equals what annually compounded rate?", "o": ["5.0000%", "5.1271%", "4.8790%", "5.2500%"], "a": 1, "why": "i = e^0.05 − 1 = 5.1271%。4.8790% 係 ln(1.05)，方向調轉咗。"}, {"q": "$100 invested at 5% continuously compounded for 1 year. FV?", "o": ["$105.00", "$105.13", "$104.88", "$105.06"], "a": 1, "why": "FV = 100 × e^0.05 = 105.13。"}], "sheet": {"f": [{"t": "每日複利", "m": "r = 365 × [ (1 + i)<sup>1/365<\/sup> − 1 ]", "v": "i = 年複利利率"}, {"t": "連續複利", "m": "r = ln(1 + i)   ⇔   i = e<sup>r<\/sup> − 1", "v": "ln = 自然對數；e ≈ 2.71828"}, {"t": "連續複利 FV / DF", "m": "FV = PV × e<sup>r × t<\/sup>   ·   DF = e<sup>−r × t<\/sup>"}], "how": ["年複利 → 連續：ln(1 + i)", "連續 → 年複利：e^r − 1", "計數機用 ln( 同 eˣ 掣"], "trap": ["同一個實際回報：年 > 半年 > 季 > 月 > 日 > 連續（報價由高到低）", "ln(1.06) = 5.8269%；唔好將 e^0.06 − 1 = 6.18% 當答案"]}}, {"id": "1.6", "lec": "L1", "zh": "由價錢計收益率", "en": "Yield from PV and FV", "sl": [16, 17, 22, 23, 24], "idea": "<b>Time value of money<\/b>：今日嘅 $100 好過一年後嘅 $100，因為今日可以拎去賺息。知道今日俾幾多（<b>PV<\/b>）、將來收幾多（<b>FV<\/b>），先計期間回報，再<b>年化<\/b>。", "terms": [["present value (PV)", "現值"], ["future value (FV)", "終值"], ["simple yield", "單利收益率"], ["annualise", "年化"], ["rate of return", "回報率"]], "params": [{"l": "今日俾 PV", "v": "$138.00"}, {"l": "將來收 FV", "v": "$139.58"}, {"l": "日數 days", "v": "64 d"}], "steps": [{"c": "今日俾 <b class=\"k1\">PV<\/b>，64 日後收 <b class=\"k2\">FV<\/b>。", "f": "PV = <b class=\"k1\">$138.00<\/b>, FV = <b class=\"k2\">$139.58<\/b>, days = 64"}, {"c": "期間回報（<b class=\"k3\">綠色差距<\/b>）= FV ÷ PV − 1。", "f": "Return over 64 days = <b class=\"k2\">139.58<\/b> / <b class=\"k1\">138.00<\/b> − 1 = <b class=\"k3\">0.011449<\/b>"}, {"c": "年化：乘 365 ÷ 64 → <b class=\"k4\">simple yield<\/b>。", "f": "Simple yield = <b class=\"k3\">0.011449<\/b> × 365/64 = <b class=\"k4\">6.5297%<\/b>"}, {"c": "如果假設再投資，就用次方 → compound yield。", "f": "Compound yield = (139.58/138.00)^(365/64) − 1 = 6.7080%"}], "tips": [{"s": 24, "tip": "同樣賺 $X，日數越少，年化收益越高。"}], "mc": [{"q": "Pay $980, receive $1,000 after 91 days. Simple yield (ACT/365)?", "o": ["2.0408%", "8.1857%", "8.4407%", "8.0000%"], "a": 1, "why": "(1000/980 − 1) × 365/91 = 8.1857%。2.04% 係未年化。"}, {"q": "Which is the simple yield formula?", "o": ["(FV/PV − 1) × year/days", "(FV/PV)^(year/days) − 1", "(FV − PV) × days/year"], "a": 0, "why": "單利收益率 = 期間回報 × year/days；次方嗰條係 compound yield。"}, {"q": "Two investments cost the same and make the same dollar gain, but investment X lasts fewer days. Compared with the other, X's simple yield is:", "o": ["Higher", "Lower", "Unchanged"], "a": 0, "why": "乘 365/days，日數越少，年化收益越高。"}, {"q": "Pay $9,850 today, receive $10,000 in 120 days. Simple yield (ACT/365)?", "o": ["4.5625%", "1.5228%", "4.6320%", "4.5685%"], "a": 2, "why": "(10,000/9,850 − 1) × 365/120 = 0.015228 × 3.0417 = 4.6320%。1.5228% 係未年化；4.5625% 錯用面值做分母。"}], "sheet": {"f": [{"t": "單利收益率 Simple yield", "m": "y = (FV / PV − 1) × year / days"}, {"t": "複利收益率 Compound yield", "m": "y = (FV / PV)<sup>year / days<\/sup> − 1"}], "how": ["PV = 今日俾嘅錢；FV = 將來收嘅錢", "FV ÷ PV − 1 = 呢段時間賺幾多 %", "× 365/days 年化"], "trap": ["分母係 <b>PV（俾出嘅錢）<\/b>，唔係 FV", "未乘 365/days 嘅數係未年化，係陷阱選項", "同一個 $ 回報，日數越少，年化收益越高"]}}, {"id": "1.7", "lec": "L1", "zh": "折現因子", "en": "Discount factors", "sl": [23, 25, 26, 27, 28], "idea": "<b>折現 discounting<\/b> = 將將來嘅錢帶返今日。PV = FV × <b>DF<\/b>，DF = 1 ÷ growth factor。", "terms": [["discounting", "折現"], ["discount factor (DF)", "折現因子"], ["present value", "現值"]], "params": [{"l": "年利率 rate", "v": "8.5%"}, {"l": "年數 years", "v": "3 yr"}, {"l": "將來收 FV", "v": "$100"}], "steps": [{"c": "3 年後收 <b class=\"k2\">$100<\/b>。", "f": "FV = <b class=\"k2\">$100.00<\/b> in 3 years"}, {"c": "每向前行一年，就除以 (1 + <b class=\"k3\">8.5%<\/b>)，金額越縮越細（<b class=\"k1\">藍色<\/b>）。", "f": "Each year back ÷ <b class=\"k3\">1.085<\/b>: 92.17 → 84.95 → 78.29"}, {"c": "總共除 3 次 = 乘 <b class=\"k4\">discount factor<\/b>。", "f": "DF = 1 / (1.085)^3 = <b class=\"k4\">0.7829<\/b>"}, {"c": "PV = FV × DF。", "f": "PV = <b class=\"k2\">100<\/b> × <b class=\"k4\">0.7829<\/b> = <b><b class=\"k1\">$78.29<\/b><\/b>"}], "tips": [{"s": 28, "tip": "利率越高或者年期越長，DF 越細，PV 越低。"}], "mc": [{"q": "3-year discount factor at 8.5% compounded annually?", "o": ["0.7450", "0.7829", "0.9217", "0.8500"], "a": 1, "why": "1/1.085³ = 0.7829（slide 28）。"}, {"q": "PV of $1,000,000 in 90 days at 5% simple, ACT/360?", "o": ["$987,654.32", "$950,000.00", "$987,500.00", "$987,821.38"], "a": 0, "why": "短期用單利 DF：1/(1 + 0.05 × 90/360) = 0.987654。"}, {"q": "Discount factor with continuous compounding:", "o": ["1/(1 + r)^t", "e^(−r × t)", "1 − r × t"], "a": 1, "why": "連續複利嘅 DF = e^(−r × days/year)。"}, {"q": "If the interest rate rises, the discount factor:", "o": ["Rises", "Falls", "Stays the same"], "a": 1, "why": "分母 (1 + i) 變大，DF 變細，PV 跌。"}, {"q": "PV of $10,000 due in 2 years at 5% compounded annually?", "o": ["$9,000.00", "$9,070.29", "$9,090.91", "$9,523.81"], "a": 1, "why": "10,000 / 1.05² = 10,000 / 1.1025 = 9,070.29。$9,523.81 只係折現一年。"}, {"q": "2-year discount factor at 6% continuously compounded?", "o": ["0.8900", "0.8869", "0.8870", "0.9418"], "a": 1, "why": "DF = e^(−0.06 × 2) = e^(−0.12) = 0.8869。0.8900 係 1/1.06²。"}], "sheet": {"f": [{"t": "PV = FV × DF", "m": "PV = FV × DF"}, {"t": "DF（單利，一年內）", "m": "DF = 1 / (1 + i × days / year)"}, {"t": "DF（複利，長期）", "m": "DF = 1 / (1 + i)<sup>n<\/sup>"}, {"t": "DF（連續複利）", "m": "DF = e<sup>−i × t<\/sup>"}], "how": ["一年內：單利 DF；超過一年：複利 DF", "DF 一定細過 1", "PV = 將來金額 × DF"], "trap": ["利率升 → DF 跌 → PV 跌", "3 年 8.5%：1 ÷ 1.085³ = 0.7829"]}}, {"id": "1.8", "lec": "L1", "zh": "淨現值 NPV", "en": "Net present value", "sl": [29], "idea": "每筆現金流按<b>佢自己嗰年<\/b>折現，<b>保留正負號<\/b>（收錢 +，俾錢 −），然後加埋。", "terms": [["net present value (NPV)", "淨現值"], ["cash inflow", "現金流入"], ["cash outflow", "現金流出"]], "params": [{"l": "折現率 rate", "v": "7.5%"}, {"l": "Year 1", "v": "$83"}, {"l": "Year 2", "v": "−$10"}, {"l": "Year 3", "v": "$150"}], "steps": [{"c": "三年嘅現金流：向上 = 收錢，向下 = 俾錢。", "f": "Cash flows: Y1 <b class=\"k1\">$83<\/b>, Y2 <b class=\"k2\">−$10<\/b>, Y3 <b class=\"k3\">$150<\/b>; r = 7.5%"}, {"c": "Year 1 除 1 次：<b class=\"k1\">藍色<\/b>。", "f": "<b class=\"k1\">83<\/b> / 1.075 = <b class=\"k1\">77.21<\/b>"}, {"c": "Year 2 除 2 次（平方）：<b class=\"k2\">橙色<\/b>，記住負數照保留。", "f": "<b class=\"k2\">−10<\/b> / 1.075² = <b class=\"k2\">−8.65<\/b>"}, {"c": "Year 3 除 3 次（立方）：<b class=\"k3\">綠色<\/b>。", "f": "<b class=\"k3\">150<\/b> / 1.075³ = <b class=\"k3\">120.74<\/b>"}, {"c": "全部 PV 加埋 = <b class=\"k4\">NPV<\/b>。", "f": "NPV = <b class=\"k1\">77.21<\/b> + (<b class=\"k2\">−8.65<\/b>) + <b class=\"k3\">120.74<\/b> = <b><b class=\"k4\">$189.30<\/b><\/b>"}], "tips": [{"s": 29, "tip": "NPV > 0：項目回報高過折現率，值得做；NPV < 0：唔值得。"}], "mc": [{"q": "Slide 29: +83, −10, +150 in years 1–3 at 7.5%. NPV?", "o": ["$206.60", "$189.30", "$223.00", "$175.18"], "a": 1, "why": "77.21 − 8.65 + 120.74 = 189.30。$206.60 係漏咗 −10 嘅負號。"}, {"q": "Pay $1,000 now; receive $400 at the end of years 1, 2 and 3. NPV at 8%?", "o": ["$200.00", "$30.84", "−$30.84", "$1,030.84"], "a": 1, "why": "−1000 + 400/1.08 + 400/1.08² + 400/1.08³ = 30.84。"}, {"q": "A positive NPV means the project:", "o": ["Earns more than the discount rate", "Earns less than the discount rate", "Has no risk"], "a": 0, "why": "NPV > 0 = 回報高過用嚟折現嘅利率。"}, {"q": "Pay $500 today; receive $200 at the end of each of years 1, 2 and 3. NPV at 10%?", "o": ["+$100.00", "−$2.63", "+$2.63", "+$45.45"], "a": 1, "why": "−500 + 200/1.1 + 200/1.1² + 200/1.1³ = −500 + 181.82 + 165.29 + 150.26 = −2.63。負數 = 回報低過 10%，唔抵做。"}], "sheet": {"f": [{"t": "NPV", "m": "NPV = Σ CF<sub>t<\/sub> / (1 + r)<sup>t<\/sup>   ( + CF<sub>0<\/sub> 今日嗰筆唔使折現 )", "v": "CF = 現金流：收錢 +、俾錢 −"}], "how": ["列晒每年現金流，保留正負號", "第 t 年就除 (1 + r) 嘅 t 次方", "今日俾出嘅錢（例如 −1,000）直接加，唔使折現", "全部加埋"], "trap": ["負數現金流要保留負號（slide 29 第 2 年係 −10）", "NPV > 0 → 回報高過折現率，值得做"]}}, {"id": "1.9", "lec": "L1", "zh": "內部回報率 IRR", "en": "Internal rate of return", "sl": [30, 31], "idea": "<b>IRR<\/b> = 令 <b>NPV = 0<\/b> 嘅嗰一個利率。利率越高 NPV 越低，條線打橫穿過 0 嗰點就係 IRR。", "terms": [["internal rate of return (IRR)", "內部回報率"], ["break-even rate", "打和利率"]], "params": [{"l": "Investment 1 或 2", "v": "Investment 1"}, {"l": "試吓用呢個利率", "v": "3.00%"}], "steps": [{"c": "Investment 1：今日俾 $1000，之後收 $50 × 5 年 + 第 6 年 $1050。", "f": "CF = <b class=\"k1\">-1000, 50, 50, 50, 50, 50, 1050<\/b>"}, {"c": "利率 = 0%：NPV 就係所有現金流直接加埋（<b class=\"k2\">橙點<\/b>）。", "f": "At r = 0%: NPV = <b class=\"k2\">$300.00<\/b>"}, {"c": "利率越高，NPV 越低（<b class=\"k3\">綠線<\/b>）。拉 slider 試吓唔同利率。", "f": "At r = 3.00%: NPV = <b class=\"k3\">$108.34<\/b>"}, {"c": "條線穿過 0 嘅位置 = <b class=\"k4\">IRR<\/b>。灰色虛線係另一個 investment 作比較。", "f": "IRR (NPV = 0) = <b class=\"k4\">5.0000%<\/b>   (other investment: 5.4718%)"}], "tips": [{"s": 31, "tip": "MC 計 IRR：揀中間嗰個選項代入，PV 大過價錢 → IRR 更高；細過 → IRR 更低。"}], "mc": [{"q": "The IRR is the discount rate at which:", "o": ["NPV is maximised", "NPV equals zero", "Cash flows double"], "a": 1, "why": "IRR 定義：令 NPV = 0 嘅利率。"}, {"q": "Both cost $1,000 today. Investment 1 pays $50 at the end of years 1–5 and $1,050 at the end of year 6 (IRR 5.0000%). Investment 2 pays $200 at the end of years 1–6 (IRR 5.4718%). Ranked by IRR, which is better?", "o": ["Investment 1", "Investment 2", "Equal, because both have NPV = 0"], "a": 1, "why": "IRR 越高，每年回報越高，所以 Investment 2 較好（slide 30–31）。陷阱：NPV = 0 只係喺<b>各自嘅 IRR<\/b> 先成立：Investment 1 喺 5% 先係 0，Investment 2 要去到 5.4718% 先係 0。用同一個利率比較，例如 5%：Investment 1 NPV = $0，Investment 2 NPV = +$15.14，所以回報唔一樣。"}, {"q": "Investment 1 has IRR 5%, Investment 2 has IRR 5.4718%. Discount both at the same 5%. Their NPVs are:", "o": ["Both $0", "Inv 1 = $0, Inv 2 = +$15.14", "Inv 1 = +$15.14, Inv 2 = $0"], "a": 1, "why": "NPV = 0 只會喺自己嘅 IRR 出現。5% 啱啱係 Investment 1 嘅 IRR，所以佢 NPV = 0；Investment 2 嘅 IRR 高過 5%，用 5% 折現仍然係正數 +$15.14。"}, {"q": "Pay $1,000 today for a 6-year bond with a $1,000 face value and a 5% annual coupon ($50 at the end of years 1–6, plus $1,000 face value at the end of year 6). Its IRR is:", "o": ["5%", "5.47%", "50%"], "a": 0, "why": "以面值 $1,000 買入、票息 5%，IRR 就等於票息率 5%（即 slide 31 嘅 Investment 1）。"}, {"q": "Pay $950 today for a 1-year bond paying $1,050 (5% coupon + $1,000 face) at maturity. IRR?", "o": ["5.00%", "10.00%", "10.53%", "5.26%"], "a": 2, "why": "只有一筆現金流：950 × (1 + IRR) = 1,050 → IRR = 1,050/950 − 1 = 10.53%。買平過面值，所以 IRR 高過票息 5%。"}], "sheet": {"f": [{"t": "IRR 定義", "m": "0 = −Price + Σ CF<sub>t<\/sub> / (1 + IRR)<sup>t<\/sup>"}, {"t": "等額現金流快捷（annuity）", "m": "PV = C × [1 − (1 + r)<sup>−n<\/sup>] / r"}], "how": ["IRR 冇直接公式，要試數", "MC：揀中間嘅選項代入", "PV 總和 > 價錢 → 利率太低，IRR 更高", "PV 總和 < 價錢 → 利率太高，IRR 更低", "相等 → 就係答案"], "trap": ["以面值買入嘅債券：IRR = 票息率（50 ÷ 1,000 = 5%）", "NPV = 0 只係喺各自嘅 IRR 成立；用同一個利率比，NPV 唔一樣"]}}, {"id": "2.1", "lec": "L2", "zh": "貨幣市場、參與者、風險", "en": "Money market, participants and risks", "sl": [1, 2, 3, 4], "idea": "貨幣市場 = <b>一年內<\/b>嘅短期借貸（IOU）。金額大、流動性高、<b>冇交易大堂<\/b>，靠電話同電子報價買賣。", "terms": [["money market", "貨幣市場"], ["borrower / investor", "借款人 / 投資者"], ["dealer", "交易商（自己報價做對手）"], ["broker", "經紀（只做配對）"], ["credit / liquidity / market risk", "信貸 / 流動性 / 市場風險"]], "params": [], "steps": [{"c": "借錢嗰邊（<b class=\"k1\">Borrowers<\/b>）：公司、銀行、政府。", "f": "<b class=\"k1\">Borrowers<\/b>: corporations, banks, governments"}, {"c": "借出嗰邊（<b class=\"k3\">Investors<\/b>）：退休基金、保險公司、基金、公司財務部。", "f": "<b class=\"k3\">Investors (lenders)<\/b>: pension funds, insurance companies, mutual funds, corporate treasurers"}, {"c": "中間人（<b class=\"k2\">橙色<\/b>）：Dealer 自己報 bid / offer 價做對手；Broker 只係將最高 bid 同最低 offer 配對。", "f": "<b class=\"k2\">Dealers<\/b> quote bid and offer · <b class=\"k2\">Brokers<\/b> match the highest bid with the lowest offer"}, {"c": "影響債務價值嘅三種風險（<b class=\"k4\">紫色<\/b>）。年期越長，信貸風險越大。", "f": "<b class=\"k4\">Credit risk<\/b> (default, higher for longer terms) · <b class=\"k4\">Liquidity risk<\/b> (thin trading, wide spreads) · <b class=\"k4\">Market risk<\/b>"}], "tips": [{"s": 3, "tip": "自己報價 + 自己承擔風險 + 賺 spread = <b>dealer<\/b>。<br>只係搵最高 bid 同最低 offer 去配對 + 收佣金 = <b>broker<\/b>。"}, {"s": 4, "tip": "成交少、spread 闊 → <b>liquidity risk<\/b>。<br>發行人可能還唔到錢、年期越長越高 → <b>credit risk<\/b>。<br>利率等市場環境變 → <b>market risk<\/b>。"}], "mc": [{"q": "Which is NOT a typical feature of the money market?", "o": ["Maturity usually under one year", "Trading on a physical trading floor", "High denominations", "High liquidity"], "a": 1, "why": "貨幣市場冇實體交易大堂，靠電話同電子平台。"}, {"q": "In the money market, a broker:", "o": ["Quotes its own bid and offer and takes positions", "Matches the highest bid with the lowest offer", "Issues commercial paper"], "a": 1, "why": "Broker 只做配對；自己報價做對手嘅係 dealer。"}, {"q": "An instrument is thinly traded with wide bid–offer spreads. This is:", "o": ["Credit risk", "Liquidity risk", "Market risk"], "a": 1, "why": "難買賣、價差闊 = liquidity risk。"}, {"q": "Credit risk is generally higher for:", "o": ["Longer-term debt", "Shorter-term debt", "It does not depend on term"], "a": 0, "why": "年期越長，發行人出事嘅機會越大。"}], "sheet": {"facts": ["貨幣市場 = 一年內嘅短期 IOU；金額大、流動性高、冇交易大堂（OTC）", "Borrowers：公司、銀行、政府 · Investors：退休基金、保險、基金、公司財務部", "<b>Dealer<\/b> 自己報 bid / offer、做對手、賺 spread · <b>Broker<\/b> 只配對最高 bid 同最低 offer、收佣", "Credit risk = 還唔到錢，年期越長越高 · Liquidity risk = 成交少、spread 闊 · Market risk = 市場（利率）變"]}}, {"id": "2.2", "lec": "L2", "zh": "孳息曲線同信貸評級", "en": "Yield curve and credit ratings", "sl": [5, 6, 7, 8, 9, 10], "idea": "<b>孳息曲線<\/b> = 唔同年期嘅利率（term structure）。<b>向上斜 = 預期短期利率上升<\/b>。信貸評級越低，借錢利率越高。", "terms": [["yield curve", "孳息曲線"], ["term structure", "利率期限結構"], ["credit rating", "信貸評級"], ["investment grade", "投資級別"]], "params": [{"l": "長短息差 slope", "v": "+1.50%"}], "steps": [{"c": "發達市場嘅政府債券當係<b>冇信貸風險<\/b>，所以佢嘅曲線淨係反映時間同預期。", "f": "Government securities ≈ <b class=\"k1\">credit risk-free<\/b>"}, {"c": "正常情況長息高過短息（<b class=\"k2\">向上斜<\/b>）：鎖錢越耐要求越多回報，亦反映市場<b>預期利率上升<\/b>。", "f": "Normal curve: long-term > short-term → <b class=\"k2\">short-term rates expected to rise<\/b>"}, {"c": "拉 slider：曲線平 = 預期唔變；向下斜 = 預期減息。", "f": "Slope 1.50% → <b class=\"k3\">upward → rates expected to RISE<\/b>"}, {"c": "評級機構：S&P、Moody's、Fitch。<b class=\"k4\">AAA / Aaa<\/b> 最好；BBB− / Baa3 係投資級最低。短期：A1+ / P1 最好。", "f": "<b class=\"k4\">AAA (Aaa) > AA (Aa) > A > BBB (Baa)<\/b> · short-term A1+/P1 > A2/P2 > A3/P3"}], "tips": [{"s": 6, "tip": "向上 = 預期升；平 = 不變；向下 = 預期跌。背後計法同 L3 forward-forward 一樣。"}], "mc": [{"q": "An upward-sloping yield curve suggests that short-term rates are expected to:", "o": ["Rise", "Fall", "Stay the same"], "a": 0, "why": "長息高過短息，反映預期將來短期利率上升。"}, {"q": "A flat yield curve suggests rates are expected to:", "o": ["Rise", "Fall", "Stay the same"], "a": 2, "why": "各年期利率一樣，即預期利率唔變。"}, {"q": "Moody's best-quality long-term rating is:", "o": ["AAA", "Aaa", "P1"], "a": 1, "why": "Moody's 用 Aaa；S&P 用 AAA；P1 係 Moody's 短期評級。"}, {"q": "The lowest S&P investment-grade long-term rating is:", "o": ["BBB−", "BB+", "A−"], "a": 0, "why": "BBB− / Baa3 係投資級最低一級。"}], "sheet": {"facts": ["Yield curve = 唔同年期利率嘅圖（term structure）", "向上 → 預期利率升 · 平 → 不變 · 向下 → 預期跌", "原因：2 年利率 ≈ 今年同明年 1 年利率嘅平均：(1 + i₂)² = (1 + i₁)(1 + f)", "Moody's Aaa > Aa > A > Baa；S&P AAA > AA > A > BBB · 投資級最低 = BBB− / Baa3", "短期評級：S&P A1+ / A1 / A2 / A3 · Moody's P1 / P2 / P3"]}}, {"id": "2.3", "lec": "L2", "zh": "貨幣市場工具同術語", "en": "Instruments, issuers and terminology", "sl": [11, 12, 13], "idea": "記住<b>邊個發行乜嘢<\/b>：政府 → T-bill；銀行 → time deposit、CD、banker's acceptance；公司 → commercial paper；repo → 政府 / 銀行。", "terms": [["Eurodollar", "離岸美元（存喺美國以外銀行嘅美元，同歐元無關）"], ["coupon", "票息（票面利率）"], ["discount instrument", "貼現工具（以低過面值嘅折讓價發行）"], ["bearer security", "不記名證券"], ["fixed income security", "固定收益證券"], ["yield to maturity (YTM)", "到期收益率"]], "params": [], "steps": [{"c": "<b class=\"k1\">政府<\/b>發行 Treasury bill；repo 由政府或銀行做。", "f": "<b class=\"k1\">Government<\/b> → Treasury bill · Repo (government / bank)"}, {"c": "<b class=\"k2\">銀行<\/b>：time deposit、certificate of deposit (CD)、banker's acceptance。", "f": "<b class=\"k2\">Bank<\/b> → Time deposit · CD · Banker's acceptance"}, {"c": "<b class=\"k3\">公司<\/b>：commercial paper (CP)。", "f": "<b class=\"k3\">Corporation<\/b> → Commercial paper"}, {"c": "術語（<b class=\"k4\">紫色<\/b>）：Eurodollar = 美國以外嘅美元存款；discount instrument = 冇 coupon、以折讓價買；bearer = 誰持有就付款畀誰。", "f": "<b class=\"k4\">Discount<\/b> = par value − price paid · <b class=\"k4\">YTM<\/b> = return if bought at a price and held to maturity · <b class=\"k4\">LIBOR/HIBOR<\/b> = interbank offered rate"}], "tips": [], "mc": [{"q": "\"Eurodollar\" means:", "o": ["US dollars deposited at banks outside the US", "Euros deposited at US banks", "A euro-denominated government bond"], "a": 0, "why": "Eurodollar = 喺美國以外銀行嘅美元存款。"}, {"q": "A discount instrument:", "o": ["Pays a fixed coupon", "Pays no coupon and is bought below par", "Is always issued by a bank"], "a": 1, "why": "冇 coupon，回報 = 面值 − 買入價。"}, {"q": "Commercial paper is issued by:", "o": ["Governments", "Corporations", "Central banks only"], "a": 1, "why": "CP 係公司發行嘅短期票據。"}, {"q": "A bearer security pays principal (and coupon) to:", "o": ["The original buyer", "Whoever holds it at maturity", "The registered owner only"], "a": 1, "why": "Bearer = 不記名，誰持有就付款畀誰。"}], "sheet": {"facts": ["T-bill → 政府 · TD、CD、BA → 銀行 · CP → 公司 · Repo → 政府 / 銀行", "Eurodollar = 美國以外銀行嘅美元（離岸美元，同歐元無關）", "Coupon = 發行時寫明嘅利率 · Discount instrument = 冇票息、以低過面值發行", "Bearer = 誰持有就俾誰 · Fixed income = 現金流事先寫死 · YTM = 買入後揸到期嘅回報"]}}, {"id": "2.4", "lec": "L2", "zh": "LIBOR → SOFR", "en": "LIBOR, the scandal and SOFR", "sl": [14, 15, 16, 17, 18], "idea": "LIBOR 靠銀行<b>估計<\/b>出嚟，曾被操控，已經停用。美國改用 <b>SOFR<\/b>：根據<b>真實<\/b>隔夜國庫券 repo 交易。", "terms": [["LIBOR", "倫敦銀行同業拆息"], ["panel bank", "報價銀行"], ["SOFR", "有抵押隔夜融資利率"], ["repo", "回購協議"], ["benchmark", "基準利率"]], "params": [], "steps": [{"c": "LIBOR 點計：每朝 11 點，panel banks 報<b>估計<\/b>借貸成本；去走最高同最低各 25%，平均剩低嘅（<b class=\"k1\">藍色<\/b>）。", "f": "LIBOR = average of the <b class=\"k1\">middle 50%<\/b> of panel bank submissions (estimates, 11:00 London)"}, {"c": "醜聞（<b class=\"k2\">橙色<\/b>）：Barclays 等 2005–07 為交易利潤操控；2007–08 壓低報價扮風險低；2012 年 UBS trader 被捕。", "f": "<b class=\"k2\">2005–07<\/b> manipulated for trading profit · <b class=\"k2\">2007–08<\/b> lowballed to look less risky · <b class=\"k2\">2012<\/b> UBS trader arrested"}, {"c": "停用（<b class=\"k4\">紫色<\/b>）：2021 年底停 GBP、EUR、CHF、JPY 同 1 週 / 2 個月 USD；其餘 USD 2023 年 6 月 30 日停。", "f": "Ceased: <b class=\"k4\">31 Dec 2021<\/b> (GBP, EUR, CHF, JPY, 1W & 2M USD) · <b class=\"k4\">30 Jun 2023<\/b> (remaining USD)"}, {"c": "<b class=\"k3\">SOFR<\/b>：用國庫券做抵押嘅隔夜 repo，NY Fed 每朝公佈前一日數字。CME Term SOFR 用 SR1（13 個月）同 SR3（5 個）期貨計 1M/3M/6M/12M。", "f": "<b class=\"k3\">SOFR = actual completed repo transactions<\/b> · LIBOR = quotes · Term SOFR from SR1 ×13 and SR3 ×5 futures"}], "tips": [], "mc": [{"q": "How was LIBOR calculated from the panel submissions?", "o": ["Average of all submissions", "Drop the highest and lowest 25%, average the rest", "The median of the highest quarter"], "a": 1, "why": "去走最高同最低各 25%，平均中間 50%。"}, {"q": "The key difference between SOFR and LIBOR:", "o": ["SOFR is unsecured", "SOFR is based on actual completed transactions", "SOFR is set by panel bank estimates"], "a": 1, "why": "SOFR 係真實 repo 交易；LIBOR 係銀行報價估計。"}, {"q": "The remaining USD LIBOR settings stopped being published after:", "o": ["31 December 2021", "30 June 2023", "31 December 2019"], "a": 1, "why": "其他貨幣 2021 年底停；USD 主要年期 2023 年 6 月 30 日停。"}, {"q": "SOFR is a rate for:", "o": ["Unsecured 3-month interbank loans", "Overnight loans secured by Treasuries (repo)", "Corporate bonds"], "a": 1, "why": "Secured Overnight Financing Rate = 有國庫券抵押嘅隔夜 repo。"}, {"q": "Eight panel banks submit 3.1, 3.2, 3.3, 3.3, 3.4, 3.5, 3.6 and 4.0%. LIBOR is:", "o": ["3.4250%", "3.3500%", "3.3750%", "3.4000%"], "a": 2, "why": "去走最低 25%（3.1、3.2）同最高 25%（3.6、4.0），平均中間：(3.3 + 3.3 + 3.4 + 3.5)/4 = 3.375%。3.425% 係全部平均。"}], "sheet": {"facts": ["LIBOR = 銀行同業無抵押拆出利率；panel bank 11:00 報估計，去頭尾各 25%，平均中間 50%", "5 種貨幣 × 7 個年期（O/N 至 1 年）", "2021 年底大部分停；USD 餘下 2023 年 6 月 30 日停", "SOFR = 有抵押（美國國庫債 repo）、隔夜、<b>真實交易<\/b>；LIBOR = 無抵押、銀行<b>估計<\/b>"], "f": [{"t": "LIBOR 計法", "m": "去走最高 25% 同最低 25% → 平均其餘"}]}}, {"id": "2.5", "lec": "L2", "zh": "日數基準 ACT/360 vs ACT/365", "en": "Day-count conventions", "sl": [19], "idea": "利息 = 本金 × 利率 × <b>日數 ÷ 一年日數<\/b>。大部分市場用 <b>360<\/b>；港元、英鎊等用 <b>365<\/b>。同一個利率，360 收多啲息。", "terms": [["day count convention", "日數基準"], ["ACT/360", "實際日數 / 360"], ["ACT/365", "實際日數 / 365"]], "params": [{"l": "利率 rate", "v": "5.00%"}, {"l": "日數 days", "v": "91 d"}], "steps": [{"c": "公式：本金 × 利率 × 實際日數 ÷ 一年日數。", "f": "Interest = principal × rate × <b class=\"k2\">days in period<\/b> / days in year"}, {"c": "美元用 <b class=\"k1\">ACT/360<\/b>：$1,000,000，5.00%，91 日。", "f": "USD: 1,000,000 × 0.0500 × <b class=\"k2\">91<\/b>/<b class=\"k1\">360<\/b> = <b class=\"k1\">$12,638.89<\/b>"}, {"c": "港元用 <b class=\"k3\">ACT/365<\/b>：同一個利率同日數，收少啲。", "f": "HKD: 1,000,000 × 0.0500 × <b class=\"k2\">91<\/b>/<b class=\"k3\">365<\/b> = <b class=\"k3\">$12,465.75<\/b>"}, {"c": "要比較兩個基準：rate<sub>365<\/sub> = rate<sub>360<\/sub> × 365/360。記住邊啲貨幣用 365（<b class=\"k4\">紫色<\/b>）。", "f": "5.00% on 360 = <b class=\"k4\">5.0694%<\/b> on 365 · ACT/365: GBP, HKD, SGD, MYR, TWD, THB, ZAR (+ domestic JPY, CAD, AUD, NZD)"}], "tips": [{"s": 19, "tip": "記：英鎊、港幣、星元等用 365；美元、歐元用 360。"}], "mc": [{"q": "Interest on USD 1,000,000 at 5% for 91 days?", "o": ["$12,465.75", "$12,638.89", "$12,500.00", "$50,000.00"], "a": 1, "why": "USD 用 360：1,000,000 × 0.05 × 91/360 = 12,638.89。"}, {"q": "Which currency uses ACT/365 in both domestic and international markets?", "o": ["USD", "EUR", "HKD", "CHF"], "a": 2, "why": "HKD、GBP、SGD、MYR、TWD、THB、ZAR 都係 ACT/365。"}, {"q": "JPY interbank deals in the international (Euro) market use:", "o": ["ACT/365", "ACT/360"], "a": 1, "why": "JPY 只係本地市場用 365，國際市場用 360。"}, {"q": "5% on an ACT/360 basis equals what rate on an ACT/365 basis?", "o": ["4.9315%", "5.0000%", "5.0694%"], "a": 2, "why": "5% × 365/360 = 5.0694%。"}, {"q": "Interest on GBP 2,000,000 at 4.5% for 90 days?", "o": ["£22,500.00", "£22,191.78", "£90,000.00", "£22,808.22"], "a": 1, "why": "英鎊用 ACT/365：2,000,000 × 0.045 × 90/365 = 22,191.78。£22,500 係錯用 360。"}, {"q": "4% on an ACT/365 basis equals what rate on an ACT/360 basis?", "o": ["4.0556%", "4.0000%", "3.9452%", "3.9726%"], "a": 2, "why": "同一筆利息：r₃₆₀ × days/360 = 4% × days/365 → r₃₆₀ = 4% × 360/365 = 3.9452%。分母細咗，報價要低啲。"}], "sheet": {"f": [{"t": "利息", "m": "Interest = P × i × days / year"}, {"t": "360 ↔ 365 轉換", "m": "i<sub>365<\/sub> = i<sub>360<\/sub> × 365 / 360   ·   i<sub>360<\/sub> = i<sub>365<\/sub> × 360 / 365"}], "how": ["睇貨幣決定 year：大部分（USD、EUR）360", "ACT/365：GBP、HKD、SGD、MYR、TWD、THB、ZAR", "JPY、CAD、AUD、NZD：本地 365，國際 360"], "trap": ["同一筆利息，360 基準報價較低：5% (360) = 5.0694% (365)"]}}, {"id": "2.6", "lec": "L2", "zh": "報價：Bid / Offer 同 Eurodeposit", "en": "Dealer quotes and Eurodeposits", "sl": [20], "idea": "Dealer 借出 = <b>LIBOR（offer）<\/b>；收存款 = <b>LIBID（bid）<\/b>。規則：<b>借錢俾高價，存款收低價<\/b>，差價係 dealer 利潤。", "terms": [["offered rate (LIBOR)", "拆出利率（dealer 借錢出去收嘅利率）"], ["bid rate (LIBID)", "拆入利率（dealer 收存款俾嘅利率）"], ["spread", "買賣差價（offer − bid）"], ["Eurodeposit", "離岸貨幣存款（喺貨幣本國以外存款，同歐元無關）"]], "params": [{"l": "Offer 借出價", "v": "4.50%"}, {"l": "Bid 存款價", "v": "4.40%"}], "steps": [{"c": "Eurodeposit 全日 24 小時喺星港、巴林、法蘭克福、巴黎、倫敦、紐約交易。Dealer 有兩個價。", "f": "Dealer lends at <b class=\"k2\">LIBOR (offer)<\/b> and takes deposits at <b class=\"k1\">LIBID (bid)<\/b>"}, {"c": "倫敦報價：<b>offer 先，bid 後<\/b>（高先）；其他地方 bid 先。", "f": "London: <b class=\"k2\">4.50%<\/b> – <b class=\"k1\">4.40%<\/b> (offer – bid) · elsewhere: 4.40% – 4.50%"}, {"c": "你借錢 → 俾<b class=\"k2\">高<\/b>嗰個；你存錢 → 收<b class=\"k1\">低<\/b>嗰個。客人永遠攞差嗰邊。", "f": "Borrow: pay <b class=\"k2\">4.50%<\/b> · Deposit: receive <b class=\"k1\">4.40%<\/b>"}, {"c": "差價就係 dealer 利潤（<b class=\"k4\">紫色<\/b>）：$10m，91 日。", "f": "Dealer earns 10,000,000 × <b class=\"k4\">0.0010<\/b> × 91/360 = <b class=\"k4\">$2,527.78<\/b>"}], "tips": [], "mc": [{"q": "A London dealer quotes 4.50 – 4.40. You want to BORROW. You pay:", "o": ["4.40%", "4.45%", "4.50%"], "a": 2, "why": "借錢俾高價（offer）。"}, {"q": "A London dealer quotes 4.50 – 4.40. You want to DEPOSIT. You receive:", "o": ["4.40%", "4.50%"], "a": 0, "why": "存款收低價（bid）。"}, {"q": "In London, deposit rates are quoted as:", "o": ["bid – offer", "offer – bid"], "a": 1, "why": "倫敦報 offer 先（高先），其他地方 bid 先。"}, {"q": "LIBID is:", "o": ["The rate dealers charge for lending", "The rate dealers pay for taking deposits"], "a": 1, "why": "LIBID = bid = dealer 收存款俾嘅利率。"}, {"q": "A Singapore dealer quotes 3.60 – 3.75. You want to BORROW. You pay:", "o": ["3.60%", "3.675%", "3.75%"], "a": 2, "why": "倫敦以外報 bid – offer（低先）。借錢一定俾高嗰個 = 3.75%。"}], "sheet": {"facts": ["Offer（LIBOR）= dealer 借出收嘅利率（高）· Bid（LIBID）= dealer 收存款俾嘅利率（低）", "倫敦報 offer – bid（高先）；其他地方 bid – offer（低先）", "規則：借錢俾高嗰個，存錢收低嗰個（dealer 永遠贏）", "Eurodeposit = 離岸貨幣存款，24 小時全球交易"], "f": [{"t": "Dealer 賺幾多", "m": "Profit = P × (offer − bid) × days / 360"}]}}, {"id": "2.7", "lec": "L2", "zh": "日期慣例", "en": "Short dates and fixed-date conventions", "sl": [21, 22], "idea": "短期日子：<b>O/N、T/N、S/N、S/W<\/b>。到期日撞假期就用 <b>modified following<\/b>；spot 係月底，到期都係月底（<b>end/end<\/b>）。", "terms": [["overnight (O/N)", "今日到聽日"], ["tom-next (T/N)", "聽日到後日"], ["spot-next (S/N)", "spot 到下一日"], ["spot-week (S/W)", "spot 到 7 日後"], ["modified following", "修正下一營業日"], ["end/end rule", "月底對月底"]], "params": [], "steps": [{"c": "<b class=\"k1\">O/N<\/b>：今日開始，聽日到期。", "f": "<b class=\"k1\">Overnight (O/N)<\/b>: today → tomorrow"}, {"c": "<b class=\"k2\">T/N<\/b>：聽日開始，後日到期。", "f": "<b class=\"k2\">Tom-next (T/N)<\/b>: tomorrow → next day"}, {"c": "<b class=\"k3\">S/N<\/b>：spot（T+2）開始，下一日到期；<b class=\"k3\">S/W<\/b>：spot 開始，七日後到期。", "f": "<b class=\"k3\">Spot-next (S/N)<\/b>: spot → spot + 1 · <b class=\"k3\">Spot-week (S/W)<\/b>: spot → spot + 7"}, {"c": "例子（<b class=\"k4\">紫色<\/b>）：26 Feb 做兩個月存款，spot = 28 Feb（月底）→ 到期都要月底 = 30 Apr；30 Apr 係星期日，<b>唔可以過去五月<\/b>，所以退返 28 Apr（星期五）。", "f": "Deal 26 Feb → spot <b class=\"k4\">28 Feb<\/b> (month-end) → end/end: <b class=\"k4\">30 Apr<\/b> (Sunday) → roll back to <b class=\"k4\">28 Apr<\/b>"}], "tips": [], "mc": [{"q": "A deposit starting tomorrow and maturing the next day is:", "o": ["Overnight (O/N)", "Tom-next (T/N)", "Spot-next (S/N)"], "a": 1, "why": "T/N = tomorrow → next day。"}, {"q": "Spot is a month-end. Under the end/end rule, forward maturity dates are:", "o": ["Exactly 30 days later", "Also month-ends", "The next business day"], "a": 1, "why": "Spot 係月底，到期日都係月底。"}, {"q": "A 2-month deposit should mature on 30 April, a Sunday. Under modified following it matures on:", "o": ["Monday 1 May", "Friday 28 April", "Saturday 29 April"], "a": 1, "why": "唔可以推去下個月，所以退返四月最後一個營業日 28 Apr。"}], "sheet": {"facts": ["O/N 今日 → 聽日 · T/N 聽日 → 後日 · S/N spot → spot + 1 · S/W spot → spot + 7", "Spot = 成交後 2 個營業日", "End/end：spot 係月尾 → 到期都係月尾", "Modified following：遇假期推去下個營業日；推過咗下個月就退返同月最後營業日"], "how": ["26 Feb 成交 → spot 28 Feb（月尾）", "2 個月 → 4 月月尾 30 Apr", "30 Apr 係星期日 → 1 May 過咗月 → 退返 28 Apr（星期五）"]}}, {"id": "2.8", "lec": "L2", "zh": "存款證 CD：定價同收益", "en": "Certificate of deposit pricing and yield", "sl": [23, 24, 25, 26, 27, 28, 29, 30], "idea": "<b>兩步<\/b>：① 用 <b>coupon<\/b> 計到期收幾多；② 用<b>今日市場利率<\/b>同<b>剩餘日數<\/b>折現返今日。CD 可轉讓；time deposit 唔可以。", "terms": [["certificate of deposit (CD)", "存款證"], ["time deposit", "定期存款"], ["negotiable", "可轉讓"], ["maturity proceeds", "到期收款"], ["secondary market", "二手市場"]], "params": [{"l": "Coupon", "v": "5.00%"}, {"l": "今日市場利率", "v": "4.00%"}, {"l": "剩餘日數 days left", "v": "61 d"}], "steps": [{"c": "CD：銀行發、有 coupon、報 yield、<b>可以轉讓<\/b>（time deposit 唔可以）。XYZ CD：$1m，coupon 5%，一年。", "f": "XYZ CD: face $1,000,000 · coupon <b class=\"k1\">5.00%<\/b> · 2 Jan 2014 → 2 Jan 2015 (365 days)"}, {"c": "第一步（<b class=\"k1\">藍色<\/b>）：coupon 決定到期收幾多。", "f": "Maturity proceeds = 1,000,000 × (1 + <b class=\"k1\">0.0500<\/b> × 365/365) = <b class=\"k1\">$1,050,000.00<\/b>"}, {"c": "第二步（<b class=\"k2\">橙色<\/b>）：仲有 61 日，用今日 4.00% 折現返今日。<b>唔好用 coupon 折現。<\/b>", "f": "Price = 1,050,000.00 / (1 + <b class=\"k2\">0.0400<\/b> × <b class=\"k2\">61<\/b>/365) = <b class=\"k2\">$1,043,027.43<\/b>"}, {"c": "如果有人出價 $1,042,800 買你張 CD，反推收益率（<b class=\"k3\">綠色<\/b>）。", "f": "Yield = (1,050,000 / 1,042,800 − 1) × 365/61 = <b class=\"k3\">4.13%<\/b>"}, {"c": "報價 4.13 – 3.89：dealer 用 <b class=\"k4\">4.13%<\/b> 收益率向你<b>買<\/b>（俾你較低價），用 <b class=\"k4\">3.89%<\/b> <b>賣<\/b>俾你（收你較高價）。", "f": "Quote <b class=\"k4\">4.13 – 3.89<\/b>: dealer buys at a 4.13% yield, sells at a 3.89% yield"}], "tips": [{"s": 25, "tip": "票息率只決定到期收幾多；價錢由今日市場利率決定。"}, {"s": 29, "tip": "價錢同 yield 反方向：價越低，買家 yield 越高。"}], "mc": [{"q": "$2m CD, 4% coupon, 365-day term (ACT/365). 90 days left, market rate 3.5%. Price?", "o": ["$2,062,202.91", "$2,080,000.00", "$2,060,273.97", "$2,000,000.00"], "a": 0, "why": "到期收 2,080,000；再除 (1 + 0.035 × 90/365)。"}, {"q": "To price a CD in the secondary market, you discount the maturity proceeds at:", "o": ["The coupon rate", "The current market rate for the remaining days", "The rate on the issue date"], "a": 1, "why": "Coupon 只決定收幾多；折現用今日市場利率。"}, {"q": "A London dealer quotes a CD at 4.13 – 3.89 (yields). If you SELL the CD to the dealer, the price gives the dealer a yield of:", "o": ["3.89%", "4.13%"], "a": 1, "why": "Dealer 買入用較高收益率 = 較低價錢，對佢有利。"}, {"q": "Which is NOT negotiable?", "o": ["Certificate of deposit", "Time deposit", "Treasury bill"], "a": 1, "why": "Time deposit 唔可以轉讓；CD 就係可以轉讓嘅版本。"}, {"q": "$1,000,000 CD, 6% coupon, 180-day term (ACT/360). With 60 days left, the market rate is 5%. Price?", "o": ["$1,030,000.00", "$1,021,487.60", "$1,019,801.98", "$1,001,652.89"], "a": 1, "why": "第一步：到期收 1,000,000 × (1 + 0.06 × 180/360) = 1,030,000。第二步：用 5% 同 60 日折現：1,030,000 / (1 + 0.05 × 60/360) = 1,021,487.60。$1,019,801.98 係錯用票息 6% 折現。"}, {"q": "You buy a CD for $990,000. It pays $1,000,000 in 45 days (ACT/365). Your yield?", "o": ["8.0808%", "8.1111%", "8.1930%", "1.0101%"], "a": 2, "why": "(1,000,000/990,000 − 1) × 365/45 = 0.010101 × 8.1111 = 8.1930%。8.1111% 錯用面值做分母；8.0808% 錯用 360。"}, {"q": "A dealer quotes a CD at 4.13 – 3.89 (yields). You BUY the CD from the dealer. The price gives you a yield of:", "o": ["4.13%", "3.89%", "4.01%"], "a": 1, "why": "Dealer 賣俾你用較低 yield = 較高價，對 dealer 有利。你買入嘅回報係 3.89%。"}], "sheet": {"f": [{"t": "① 到期收款", "m": "Proceeds = Face × (1 + coupon × term days / year)", "v": "用<b>票息率<\/b>同<b>成個年期<\/b>日數"}, {"t": "② 今日價錢", "m": "Price = Proceeds / (1 + market rate × days left / year)", "v": "用<b>今日市場利率<\/b>同<b>剩餘日數<\/b>"}, {"t": "③ 收益率", "m": "yield = (Proceeds / Price − 1) × year / days left"}], "how": ["第一步：計到期收幾多（票息）", "第二步：用今日利率同剩餘日數折現", "問 yield：倒轉用第三條", "CD 報價 4.13 – 3.89：你賣俾 dealer 用 4.13%（價低），你買用 3.89%（價高）"], "trap": ["折現唔好用票息率！票息只決定到期收幾多", "價錢同 yield 反方向：yield 高 = 價低", "CD 可轉讓；time deposit 唔可以"]}}, {"id": "2.9", "lec": "L2", "zh": "T-bill：discount rate vs yield", "en": "Treasury bills, discount rate and true yield", "sl": [31, 32, 33, 34], "idea": "T-bill 冇 coupon，以<b>折讓價<\/b>發行。美國用 <b>discount rate<\/b> 報價（以<b>面值<\/b>計）；true yield 以<b>價錢<\/b>計，所以 <b>yield 一定大過 discount rate<\/b>。", "terms": [["Treasury bill", "國庫券"], ["discount rate", "貼現率"], ["true yield", "真實收益率"], ["face value", "面值"], ["T+1", "交易後一日交收"]], "params": [{"l": "Discount rate D", "v": "4.12%"}, {"l": "日數 days", "v": "50 d"}], "steps": [{"c": "T-bill：政府發，13 / 26 / 52 週。美國每個星期一拍賣、星期四交收；二手市場 T+1。", "f": "US T-bill: 13, 26 or 52 weeks · auction Monday, delivery Thursday · secondary T+1"}, {"c": "價錢 = 面值 × (1 − <b class=\"k1\">D<\/b> × 日數/360)。", "f": "Price = 1,000,000 × (1 − <b class=\"k1\">0.0412<\/b> × 50/360) = <b class=\"k2\">$994,277.78<\/b>"}, {"c": "折讓金額（<b class=\"k4\">紫色<\/b>）係用<b>面值<\/b>做基礎。", "f": "Discount = 1,000,000 − 994,277.78 = <b class=\"k4\">$5,722.22<\/b>  (measured on face value)"}, {"c": "True yield 用<b>你俾嘅價錢<\/b>做基礎，價錢細過面值，所以 yield 大啲（<b class=\"k3\">綠色<\/b>）。", "f": "y = <b class=\"k1\">0.0412<\/b> / (1 − 0.0412 × 50/360) = <b class=\"k3\">4.1437%<\/b>"}, {"c": "倒轉計：D = y ÷ (1 + y × 日數/360)。T-bill 收益率<b>低過<\/b> CD，因為冇信貸風險、流動性高。", "f": "D = y / (1 + y × days/360) = 4.1200% ✓ · T-bill yield < CD yield"}], "tips": [], "mc": [{"q": "US T-bill, 91 days, discount rate 5%, face $1,000,000. Price?", "o": ["$987,361.11", "$987,654.32", "$950,000.00", "$987,534.25"], "a": 0, "why": "1,000,000 × (1 − 0.05 × 91/360) = 987,361.11。"}, {"q": "A US T-bill is priced from a quoted discount rate. Its true yield is:", "o": ["Lower than the discount rate", "Equal to the discount rate", "Higher than the discount rate"], "a": 2, "why": "Discount 用面值計；yield 用較細嘅價錢計，所以較高。"}, {"q": "A 91-day instrument yields 5% (ACT/360). Equivalent discount rate?", "o": ["5.0640%", "4.9376%", "5.0000%"], "a": 1, "why": "D = 0.05 / (1 + 0.05 × 91/360) = 4.9376%。"}, {"q": "Compared with bank CDs of the same term, T-bill yields are usually:", "o": ["Higher", "Lower"], "a": 1, "why": "政府冇違約風險、T-bill 流動性高，所以收益率較低。"}, {"q": "US T-bill, face $1,000,000, 91 days, discount rate 4%. Price?", "o": ["$990,027.40", "$989,888.89", "$960,000.00", "$989,990.10"], "a": 1, "why": "1,000,000 × (1 − 0.04 × 91/360) = 1,000,000 × 0.989889 = 989,888.89。$989,990.10 係錯當 4% 係 yield；$990,027.40 錯用 365。"}, {"q": "A 91-day US T-bill has a discount rate of 4%. True yield?", "o": ["4.0000%", "3.9596%", "4.0409%", "4.1011%"], "a": 2, "why": "y = D / (1 − D × days/360) = 0.04 / (1 − 0.04 × 91/360) = 0.04 / 0.989889 = 4.0409%。Yield 一定高過 discount rate。"}, {"q": "A 182-day instrument yields 6% (ACT/360). Equivalent discount rate?", "o": ["6.1877%", "5.8234%", "5.8180%", "6.0000%"], "a": 1, "why": "D = y / (1 + y × days/360) = 0.06 / (1 + 0.06 × 182/360) = 0.06 / 1.030333 = 5.8234%。Discount rate 一定低過 yield。"}], "sheet": {"f": [{"t": "Discount rate → 價錢", "m": "Price = Face × (1 − D × days / 360)"}, {"t": "Discount → yield", "m": "y = D / (1 − D × days / 360)"}, {"t": "Yield → discount", "m": "D = y / (1 + y × days / 360)"}], "how": ["Discount rate 係用<b>面值<\/b>計嘅折扣，直接由面值扣", "True yield 用<b>俾出嘅價錢<\/b>做分母，所以一定高過 D", "美國 T-bill 用 360"], "trap": ["Price = Face × (1 − D × t)，唔係 Face ÷ (1 + D × t)", "T-bill yield 低過 CD（政府冇違約風險 + 流動性高）"]}}, {"id": "2.10", "lec": "L2", "zh": "CP、Banker's acceptance、Repo", "en": "Commercial paper, banker's acceptances and repos", "sl": [35, 36, 37, 38], "idea": "<b>CP<\/b>：公司發，折讓價，美國 1–270 日。<b>BA<\/b>：銀行「承兌」咗嘅貿易匯票。<b>Repo<\/b>：賣出證券再約定買返，利息 = 兩個價嘅差。", "terms": [["commercial paper (CP)", "商業票據"], ["banker's acceptance (BA)", "銀行承兌匯票"], ["letter of credit (L/C)", "信用證"], ["draft", "匯票"], ["repurchase agreement (repo)", "回購協議"]], "params": [], "steps": [{"c": "進口商落單、出口商答應；進口商向自己銀行（Bank I）開<b>信用證 L/C<\/b>（<b class=\"k1\">藍色<\/b>，步驟 1–3）。", "f": "1–3: Importer orders · Exporter agrees · Importer arranges <b class=\"k1\">L/C<\/b> with Bank I"}, {"c": "Bank I 將 L/C 寄去出口商嘅銀行（Bank X），Bank X 通知出口商，出口商出貨（<b class=\"k2\">橙色<\/b>，4–6）。", "f": "4–6: Bank I sends L/C to Bank X · Bank X advises exporter · <b class=\"k2\">goods shipped<\/b>"}, {"c": "出口商將匯票同文件交 Bank X，再交 Bank I。Bank I <b>承兌<\/b>：承諾 60 日後付款 = <b class=\"k3\">banker's acceptance<\/b>（7–9）。", "f": "7–9: Draft + documents → Bank X → Bank I · Bank I <b class=\"k3\">accepts<\/b> (promises to pay in 60 days)"}, {"c": "Bank X 將承兌匯票<b>賣俾投資者<\/b>，再付錢俾出口商（<b class=\"k4\">紫色<\/b>，10–11）。", "f": "10–11: Bank X <b class=\"k4\">sells the acceptance to an investor<\/b> · Bank X pays the exporter"}, {"c": "進口商付款俾 Bank I 攞貨；到期投資者向 Bank I 收錢（12–14）。", "f": "12–14: Importer pays Bank I, gets the shipment · Investor presents the acceptance and is paid by Bank I"}], "tips": [{"s": 38, "tip": "Repo = 有抵押、短期、利息 = 價差。SOFR 就係用美國國庫債 repo 嘅真實利率計（2.4）。"}], "mc": [{"q": "US commercial paper has a maximum term of about:", "o": ["30 days", "270 days", "2 years"], "a": 1, "why": "US CP 1–270 日；ECP 2–365 日。"}, {"q": "In a banker's acceptance, who \"accepts\" the draft?", "o": ["The exporter", "The importer's bank", "The investor"], "a": 1, "why": "進口商嘅銀行（Bank I）承兌，承諾到期付款。"}, {"q": "The interest on a repo equals:", "o": ["The coupon on the security", "The difference between the purchase and repurchase prices", "LIBOR plus a margin"], "a": 1, "why": "Repo：先賣後買返，價差就係利息。"}, {"q": "In the US and UK, banker's acceptances and CP are quoted on a:", "o": ["Yield basis", "Discount rate basis"], "a": 1, "why": "美英兩地 BA、US CP 用 discount rate 報價；其他地方多數用 yield。"}], "sheet": {"facts": ["CP：公司發；US 1–270 日（discount rate 報價）；ECP 2–365 日（yield 報價）", "BA：銀行承兌嘅匯票，貿易融資；US / UK 用 discount rate 報價", "BA 流程：L/C → 出貨 → Bank I accept draft（承諾 60 日後付）→ Bank X 賣俾投資者 → 到期 Bank I 付錢", "Repo：賣債券同時約定用較高價買返 = 有抵押短期借錢；利息 = 買返價 − 賣出價；唔可轉讓"], "f": [{"t": "Repo 利息", "m": "Interest = Repurchase price − Sale price   ·   rate = interest / sale price × 360 / days"}]}}, {"id": "3.1", "lec": "L3", "zh": "遠期利率 Forward-forward", "en": "Forward-forward rate", "sl": [1, 2, 3, 4], "idea": "兩條路去同一日：<b>A<\/b> 直接存長期；<b>B<\/b> 先存短期，再用 forward rate 續存。<b>冇套利<\/b>，兩條路最後一樣錢。", "terms": [["forward-forward", "遠期對遠期"], ["no arbitrage", "無套利"], ["longer / shorter period", "長期 / 短期"]], "params": [{"l": "短期利率", "v": "13.00%"}, {"l": "短期日數", "v": "91 d"}, {"l": "長期利率", "v": "13.10%"}, {"l": "長期日數", "v": "183 d"}], "steps": [{"c": "Forward-forward：今日已經定好將來某段時間嘅存款或貸款（金額、年期、利率）。例：2 個月後存 $1M 三個月，4%，到期收 $1.01M。", "f": "$1,000,000 × (1 + 0.04 × 3/12) = $1,010,000 (all fixed today)"}, {"c": "路線 B 第一段（<b class=\"k1\">藍色<\/b>）：短期 91 日。", "f": "Short: 1 + <b class=\"k1\">0.1300<\/b> × 91/365 = <b class=\"k1\">1.03241<\/b>"}, {"c": "路線 A（<b class=\"k2\">橙色<\/b>）：直接存 183 日。", "f": "Long: 1 + <b class=\"k2\">0.1310<\/b> × 183/365 = <b class=\"k2\">1.06568<\/b>"}, {"c": "兩條路要一樣錢，所以剩低 92 日嘅利率（<b class=\"k3\">綠色<\/b>）係：", "f": "f = (<b class=\"k2\">1.06568<\/b> / <b class=\"k1\">1.03241<\/b> − 1) × 365/92 = <b class=\"k3\">12.79%<\/b>"}], "tips": [{"s": 4, "tip": "年化用 (dL − dS)，唔係 dL。"}], "mc": [{"q": "3-month (91 days) 5%, 6-month (182 days) 5.5%, ACT/360. 3v6 forward-forward rate?", "o": ["5.2500%", "5.9251%", "6.0000%", "5.5000%"], "a": 1, "why": "[(1 + 0.055 × 182/360)/(1 + 0.05 × 91/360) − 1] × 360/91 = 5.9251%。"}, {"q": "In a forward-forward, which are fixed in advance?", "o": ["Only the amount", "Term, amount and interest rate", "Only the interest rate"], "a": 1, "why": "Slide 2：term、amount、rate 全部今日定好。"}, {"q": "In the forward-forward formula, the annualising factor uses:", "o": ["year / dL", "year / (dL − dS)", "year / dS"], "a": 1, "why": "Forward 只係覆蓋長短期之間嗰段日數。"}, {"q": "3-month (90 days) rate 4%, 6-month (180 days) rate 4.5%, ACT/360. 3v6 forward-forward rate?", "o": ["5.0000%", "4.9505%", "4.2500%", "2.4752%"], "a": 1, "why": "[(1 + 0.045 × 180/360)/(1 + 0.04 × 90/360) − 1] × 360/90 = (1.0225/1.01 − 1) × 4 = 4.9505%。2.4752% 錯用 360/180 年化。"}, {"q": "1-year rate 5%, 2-year rate 6% (both annually compounded). Implied 1-year rate starting in 1 year?", "o": ["7.0095%", "7.0000%", "6.5000%", "5.5000%"], "a": 0, "why": "1.06² = 1.05 × (1 + f) → f = 1.1236/1.05 − 1 = 7.0095%。孳息曲線向上 → 預期利率上升。"}], "sheet": {"f": [{"t": "Forward-forward rate", "m": "f = [ (1 + i<sub>L<\/sub> × d<sub>L<\/sub>/year) / (1 + i<sub>S<\/sub> × d<sub>S<\/sub>/year) − 1 ] × year / (d<sub>L<\/sub> − d<sub>S<\/sub>)", "v": "L = 長期 · S = 短期 · d = 日數"}, {"t": "一年以上（複利）", "m": "(1 + i₂)² = (1 + i₁)(1 + f)  →  f = (1 + i₂)² / (1 + i₁) − 1"}], "how": ["長期增長：1 + i_L × d_L/year", "短期增長：1 + i_S × d_S/year", "長 ÷ 短 − 1 = forward 嗰段嘅增長", "× year / (d_L − d_S) 年化"], "trap": ["年化用 (d_L − d_S)，唔係 d_L", "原理：兩條路一樣錢（無套利）"]}}, {"id": "3.2", "lec": "L3", "zh": "FRA 係乜同時間線", "en": "What an FRA is and its timeline", "sl": [5, 6, 8, 9, 10], "idea": "<b>FRA<\/b> = 今日鎖定將來一段時間嘅利率。<b>冇本金交換<\/b>、冇責任借錢；只係喺<b>期頭<\/b>俾利率差額。\"6 v 12\" = 6 個月後開始、12 個月完。", "terms": [["forward rate agreement (FRA)", "遠期利率協議"], ["notional principal", "名義本金"], ["fixing date", "定息日"], ["settlement date", "結算日"], ["off-balance sheet", "資產負債表外"]], "params": [], "steps": [{"c": "1/10（月/日）交易日：賣一張 6 v 12 FRA，名義本金 100 Mio，FRA rate <b class=\"k1\">4.5%<\/b> 今日定好。", "f": "Trade date 1/10: sell 6 v 12 FRA, notional 100 Mio, FRA rate <b class=\"k1\">4.5%<\/b>"}, {"c": "1/12 spot value date（+2 工作天）。由 spot 計 6 個月 = 7/12 開始。", "f": "Spot 1/12 · FRA period starts 6 months later: 7/12"}, {"c": "7/10 定息日（<b class=\"k2\">橙色<\/b>）：期頭前兩個工作天，定出 LIBOR/SOFR。", "f": "Fixing date <b class=\"k2\">7/10<\/b>: reference rate set (2 working days before settlement)"}, {"c": "7/12 結算日（<b class=\"k3\">綠色<\/b>）：喺期頭俾<b>折現咗<\/b>嘅利率差額。冇本金交換。", "f": "Settlement <b class=\"k3\">7/12<\/b>: pay the discounted difference (start of period, no principal)"}, {"c": "1/12 到期日。用途：對沖、投機、同期貨做套利。例：公司想鎖定 2 個月後開始、為期 3 個月嘅貸款 → 買 <b class=\"k4\">2 v 5 FRA<\/b>。", "f": "Maturity 1/12 · Uses: hedging, speculation, arbitrage · Loan in 2 months for 3 months → buy a <b class=\"k4\">2 v 5<\/b> FRA"}], "tips": [], "mc": [{"q": "In an FRA, the principal amount is:", "o": ["Exchanged at the start", "Exchanged at maturity", "Never exchanged (notional only)"], "a": 2, "why": "FRA 只係俾利率差額，本金係名義嘅。"}, {"q": "\"3 v 6\" FRA means a period that:", "o": ["Lasts 3 months starting in 6 months", "Starts in 3 months and ends in 6 months", "Lasts 9 months"], "a": 1, "why": "3 個月後開始，6 個月完，為期 3 個月。"}, {"q": "The FRA settlement is paid:", "o": ["At the end of the FRA period", "At the start of the FRA period, discounted", "Daily"], "a": 1, "why": "喺期頭俾，所以要折現。"}, {"q": "A company wants to fix a 3-month loan starting in 2 months. It should:", "o": ["Buy a 2 v 5 FRA", "Sell a 2 v 5 FRA", "Buy a 3 v 5 FRA"], "a": 0, "why": "2 個月後開始、5 個月完；借錢一方要買 FRA。"}, {"q": "A company will borrow for 6 months starting in 3 months. Which FRA should it buy?", "o": ["3 v 6", "6 v 9", "3 v 9", "6 v 3"], "a": 2, "why": "3 個月後開始、9 個月完（3 + 6），所以係 3 v 9。借款人怕加息，買 FRA。"}], "sheet": {"facts": ["FRA = 今日鎖定將來一段時間嘅利率；off-balance sheet；本金唔交換", "時間線：trade date（定 FRA rate）→ fixing date（睇 LIBOR，交收前 2 日）→ settlement（期頭，俾折現差額）→ maturity", "「a v b」= a 個月後開始、b 個月完；例如 2 個月後借 3 個月 → 2 v 5", "用途：hedge（對沖）、speculate（投機）、arbitrage（套利）"], "how": ["將來要借錢、怕加息 → <b>買<\/b> FRA", "將來有錢存、怕減息 → <b>賣<\/b> FRA"]}}, {"id": "3.3", "lec": "L3", "zh": "用 FRA 對沖：買方 vs 賣方", "en": "Hedging with an FRA", "sl": [7, 10], "idea": "<b>買 FRA<\/b> = 俾固定、收 LIBOR → <b>加息就賺<\/b>，適合將來要<b>借錢<\/b>嘅人。賣方相反，適合將來要<b>存錢<\/b>嘅人。", "terms": [["FRA buyer", "FRA 買方（俾固定）"], ["FRA seller", "FRA 賣方（收固定）"], ["lending margin", "貸款息差"], ["hedge", "對沖"]], "params": [{"l": "LIBOR fixing", "v": "6.00%"}, {"l": "FRA rate", "v": "5.00%"}], "steps": [{"c": "借款人向銀行借錢，要俾 <b class=\"k2\">LIBOR + margin<\/b>（假設 0.5%）。LIBOR 越高，成本越高。", "f": "Loan cost = <b class=\"k2\">LIBOR + 0.5%<\/b> = 6.50%"}, {"c": "今日買 FRA：收 <b class=\"k1\">LIBOR<\/b>、俾固定 <b class=\"k3\">FRA rate<\/b>。", "f": "FRA: receive <b class=\"k1\">LIBOR 6.00%<\/b>, pay <b class=\"k3\">FRA 5.00%<\/b>"}, {"c": "LIBOR 一俾一收抵銷咗，淨成本 = <b class=\"k4\">FRA rate + margin<\/b>，同 LIBOR 冇關係。", "f": "Net = −(L + 0.5%) + L − 5.00% = <b class=\"k4\">−5.50%<\/b> fixed"}, {"c": "拉 LIBOR：<b class=\"k2\">紅線<\/b>（冇對沖）會變，<b class=\"k4\">紫線<\/b>（有對沖）永遠平。LIBOR 高過 FRA rate 時，FRA 賠錢俾你。", "f": "L 6.00% > FRA 5.00% → buyer <b class=\"k3\">receives<\/b> the difference"}], "tips": [{"s": 7, "tip": "買方加息賺（怕加息嘅借款人買）；賣方減息賺（怕減息嘅存款人賣）。"}], "mc": [{"q": "The buyer of an FRA gains when interest rates:", "o": ["Rise", "Fall", "Stay the same"], "a": 0, "why": "買方收 LIBOR、俾固定；LIBOR 升就賺。"}, {"q": "Who would SELL an FRA as a hedge?", "o": ["A company that will borrow in future", "An investor who will deposit cash in future", "A speculator expecting rates to rise"], "a": 1, "why": "將來要存錢嘅人怕減息，所以賣 FRA（收固定）。"}, {"q": "A borrower pays LIBOR + 0.5% and buys an FRA at 5%. Net cost?", "o": ["LIBOR + 0.5%", "5.5% fixed", "5% fixed", "LIBOR − 4.5%"], "a": 1, "why": "LIBOR 抵銷，淨 = FRA 5% + margin 0.5% = 5.5%。"}], "sheet": {"f": [{"t": "買方淨成本", "m": "Net = −(L + margin) + L − FRA = −(FRA + margin)"}], "how": ["Buyer：收 L、俾 FRA rate（加息賺）", "Seller：收 FRA rate、俾 L（減息賺）", "L 一加一減抵銷，淨成本 = FRA rate + margin"], "trap": ["Margin 唔會被對沖：L + 0.5% 嘅貸款 + 5% FRA = 5.5%", "FRA 唔借錢；貸款係另一份合約", "只係俾<b>差額<\/b>：L > FRA 賣方俾買方；L < FRA 買方俾賣方"]}}, {"id": "3.4", "lec": "L3", "zh": "FRA 結算金額", "en": "FRA settlement amount", "sl": [12], "idea": "差額本來係<b>期尾<\/b>先俾，但 FRA 喺<b>期頭<\/b>結算，所以要用 <b>LIBOR 折現<\/b>。答案負數 = <b>buyer 收錢<\/b>。", "terms": [["settlement amount", "結算金額"], ["discount", "折現"], ["notional", "名義本金"]], "params": [{"l": "名義本金 (百萬)", "v": "$10m"}, {"l": "FRA rate", "v": "5.00%"}, {"l": "LIBOR fixing", "v": "6.00%"}, {"l": "FRA 日數", "v": "91 d"}], "steps": [{"c": "如果喺<b>期尾<\/b>俾，利率差額係（<b class=\"k1\">藍色<\/b>）：", "f": "Interest difference = 10,000,000 × (<b class=\"k1\">0.0500<\/b> − <b class=\"k2\">0.0600<\/b>) × 91/360 = <b class=\"k1\">−$25,277.78<\/b>"}, {"c": "但 FRA 喺<b>期頭<\/b>結算，要用 <b class=\"k2\">LIBOR<\/b> 折現返 91 日（唔係用 FRA rate）。", "f": "Discount: 1 + <b class=\"k2\">0.0600<\/b> × 91/360 = <b class=\"k2\">1.015167<\/b>"}, {"c": "結算金額（<b class=\"k4\">紫色<\/b>）。負數即係 buyer <b>收錢<\/b>。", "f": "Buyer pays = −25,277.78 / 1.015167 = <b class=\"k4\">−$24,900.13<\/b> → buyer RECEIVES $24,900.13"}, {"c": "FRA 期超過一年：LIBOR 假設每年尾都派息，所以要拆開每一年嘅差額，逐段複利折現再加埋。", "f": "> 1 year: N(F−L)d₁/y ÷ (1 + L·d₁/y) + N(F−L)d₂/y ÷ [(1 + L·d₁/y)(1 + L·d₂/y)]"}], "tips": [], "mc": [{"q": "You SOLD a 6v9 FRA on $5m at 4%. LIBOR fixes at 3.5%, 92 days (ACT/360). You receive:", "o": ["$6,388.89", "$6,332.25", "$6,300.00", "$0"], "a": 1, "why": "5m × 0.005 × 92/360 = 6,388.89，再除 1.008944 = 6,332.25；賣方收。"}, {"q": "The FRA settlement amount is discounted using:", "o": ["The FRA rate", "The LIBOR/SOFR fixing", "The 1-year rate"], "a": 1, "why": "公式分母係 1 + LIBOR × days/year。"}, {"q": "LIBOR fixes ABOVE the FRA rate. The FRA buyer:", "o": ["Pays the difference", "Receives the difference"], "a": 1, "why": "公式出負數 → buyer 收錢（補償佢較貴嘅借貸）。"}], "sheet": {"f": [{"t": "結算金額（買方俾）", "m": "Settlement = N × (FRA − L) × days/year ÷ (1 + L × days/year)", "v": "正數 = 買方俾；負數 = 買方收"}], "how": ["分子：成段期嘅利息差 N × (FRA − L) × days/360", "分母：因為喺期頭俾，用 <b>L<\/b> 折現", "睇正負號決定邊個俾"], "trap": ["折現用 LIBOR，唔係 FRA rate", "L > FRA → 負數 → 買方收錢"]}}, {"id": "3.5", "lec": "L3", "zh": "FRA 報價", "en": "FRA quotation", "sl": [11], "idea": "先用 forward-forward 計<b>理論價<\/b>，dealer 再加減 spread。客人<b>買 FRA<\/b>（俾固定）用<b>高<\/b>嗰個；<b>賣<\/b>用<b>低<\/b>嗰個。", "terms": [["theoretical FRA rate", "理論 FRA 利率"], ["bid / offer", "買入 / 賣出報價"], ["basis point (bp)", "基點"]], "params": [{"l": "理論價", "v": "12.85%"}, {"l": "每邊 spread (bp)", "v": "3 bp"}], "steps": [{"c": "用 forward-forward 計出理論 FRA 價（<b class=\"k1\">藍色<\/b>）。", "f": "Theoretical FRA rate = <b class=\"k1\">12.85%<\/b> (from cash rates)"}, {"c": "Dealer 喺理論價兩邊加 spread，報 <b class=\"k3\">12.82%<\/b> / <b class=\"k2\">12.88%<\/b>。", "f": "Quote = 12.85% ∓ 3 bp → <b class=\"k3\">12.82%<\/b> / <b class=\"k2\">12.88%<\/b>"}, {"c": "客人<b>買<\/b> FRA = 俾固定 → 俾<b class=\"k2\">高<\/b>嗰個。", "f": "Customer buys FRA → deals at <b class=\"k2\">12.88%<\/b>"}, {"c": "客人<b>賣<\/b> FRA = 收固定 → 收<b class=\"k3\">低<\/b>嗰個。同存款報價一樣，dealer 永遠贏 spread。", "f": "Customer sells FRA → deals at <b class=\"k3\">12.82%<\/b>"}], "tips": [], "mc": [{"q": "An FRA is quoted 12.82% / 12.88%. A customer BUYING the FRA deals at:", "o": ["12.82%", "12.85%", "12.88%"], "a": 2, "why": "買方俾固定，俾高價。"}, {"q": "A customer SELLING the same FRA deals at:", "o": ["12.82%", "12.88%"], "a": 0, "why": "賣方收固定，收低價。"}, {"q": "The theoretical FRA rate comes from:", "o": ["The forward-forward calculation from cash rates", "The dealer's opinion", "The previous day's LIBOR"], "a": 0, "why": "理論價 = 用現貨利率計嘅 forward-forward rate。"}], "sheet": {"facts": ["理論 FRA rate = 由現貨利率計 forward-forward（3.1）", "Dealer 喺兩邊加 spread：12.82 / 12.88（bp = 0.01%）", "客<b>買<\/b> FRA（俾固定）→ 用高嗰個 12.88%", "客<b>賣<\/b> FRA（收固定）→ 用低嗰個 12.82%"]}}, {"id": "3.6", "lec": "L3", "zh": "Strip：合成長期定息借款", "en": "Constructing a strip", "sl": [13, 14], "idea": "先借 3 個月，之後每段用 FRA 鎖定。每段本金 = <b>上一段完咗欠嘅錢<\/b>（利息滾埋）。最後用<b>總日數<\/b>年化。", "terms": [["strip", "串連（一連串首尾相接嘅 FRA）"], ["synthetic borrowing", "合成借款"], ["rollover", "續借"]], "params": [{"l": "3M LIBOR (92d)", "v": "8.50%"}, {"l": "3v6 FRA (91d)", "v": "8.60%"}, {"l": "6v9 FRA (91d)", "v": "8.70%"}], "steps": [{"c": "一月：借 $1，3 個月 LIBOR <b class=\"k1\">8.50%<\/b>，92 日。", "f": "t0→t3: 1 × (1 + <b class=\"k1\">0.0850<\/b> × 92/360) = <b class=\"k1\">1.021722<\/b>"}, {"c": "四月：再借 1.021722（連利息），用 3v6 FRA <b class=\"k2\">8.60%<\/b> 鎖定，91 日。", "f": "t3→t6: 1.021722 × (1 + <b class=\"k2\">0.0860<\/b> × 91/360) = <b class=\"k2\">1.043933<\/b>"}, {"c": "七月：再借 1.043933，用 6v9 FRA <b class=\"k3\">8.70%<\/b>，91 日。", "f": "t6→t9: 1.043933 × (1 + <b class=\"k3\">0.0870<\/b> × 91/360) = <b class=\"k3\">1.066891<\/b>"}, {"c": "9 個月定息利率：分母用<b>總日數<\/b> 92 + 91 + 91 = 274。", "f": "Fixed rate = (1.066891 − 1) × 360/274 = <b class=\"k4\">8.79%<\/b>"}], "tips": [], "mc": [{"q": "3M LIBOR 4% (91 days), 3v6 FRA 4.2% (92 days), ACT/360. 6-month fixed rate via a strip?", "o": ["4.1000%", "4.1219%", "4.2000%", "8.2438%"], "a": 1, "why": "1.010111 × 1.010733 = 1.020953；(0.020953) × 360/183 = 4.1219%。"}, {"q": "In a strip, the notional of each later FRA is:", "o": ["Always the original $1", "The amount owed at the end of the previous period", "The average of all periods"], "a": 1, "why": "利息滾埋，下一段借嘅係上一段欠嘅錢。"}, {"q": "A 9-month strip is built from three periods of 92, 91 and 91 days (ACT/360). The annualising factor is:", "o": ["360/91", "360/274", "360/92"], "a": 1, "why": "總日數 92 + 91 + 91 = 274。"}], "sheet": {"f": [{"t": "Strip 增長", "m": "G = (1 + i₁ d₁/360)(1 + f₂ d₂/360)(1 + f₃ d₃/360)"}, {"t": "定息利率", "m": "rate = (G − 1) × 360 / (d₁ + d₂ + d₃)"}], "how": ["第一段用現貨 LIBOR", "之後每段用 FRA rate，名義本金 = 上一段欠嘅錢（滾存）", "全部相乘 = 總增長", "(G − 1) × 360 / 總日數"], "trap": ["總日數 = 92 + 91 + 91 = 274", "後面 FRA 嘅本金係 1.021722，唔係 1"]}}, {"id": "3.7", "lec": "L3", "zh": "利率期貨基本", "en": "Interest rate futures basics", "sl": [15, 16, 17, 18, 19, 20, 21, 22, 23], "idea": "期貨喺<b>交易所<\/b>買賣、<b>標準化<\/b>（金額、日子）。報價唔係利率，而係 <b>100 − 利率<\/b>，所以<b>加息 = 價跌<\/b>。", "terms": [["futures", "期貨"], ["exchange-traded", "交易所買賣"], ["hedger / speculator", "對沖者 / 投機者"], ["open outcry", "公開喊價"], ["screen trading", "電子交易"]], "params": [{"l": "3 個月利率", "v": "2.55%"}], "steps": [{"c": "期貨：約定將來交收（唔一定真係交收）；交易所買賣、合約標準化。對比 forward（例如 FRA）係 OTC。", "f": "Futures: <b class=\"k1\">exchange-traded<\/b>, standardised · Forwards/FRAs: OTC, tailor-made"}, {"c": "用家：<b class=\"k2\">hedger<\/b> 對沖現有風險；<b class=\"k2\">speculator<\/b> 用高槓桿賭方向。", "f": "Users: <b class=\"k2\">hedgers<\/b> (cover risk) · <b class=\"k2\">speculators<\/b> (leveraged positions)"}, {"c": "報價 = 100 − 利率（<b class=\"k3\">綠色<\/b>）。拉 slider：利率升，價就跌。", "f": "Price = 100 − <b class=\"k4\">2.55%<\/b> = <b class=\"k3\">97.45<\/b>"}, {"c": "Eurodollar 合約（slide 17）：$1m 三個月存款；1 bp = $25；最近月份 tick 0.0025 = $6.25；最後交易日 = 第三個星期三前兩個倫敦工作天。之後轉做 SOFR 期貨。", "f": "Eurodollar: $1m × 0.0001 × 1/4 = <b class=\"k1\">$25 per bp<\/b> · nearest tick 0.0025 = $6.25 · last trade: 2 London days before 3rd Wednesday"}, {"c": "交易方式：open outcry 喺交易池面對面喊價；screen trading 係電子平台，模仿 open outcry 嘅透明度。", "f": "Dealing: open outcry (trading pit) · screen trading (electronic)"}], "tips": [], "mc": [{"q": "A 3-month futures price is 95.80. The implied interest rate is:", "o": ["95.80%", "4.20%", "0.958%"], "a": 1, "why": "100 − 95.80 = 4.20%。"}, {"q": "If interest rates rise, the futures price:", "o": ["Rises", "Falls", "Does not change"], "a": 1, "why": "Price = 100 − rate，利率升價就跌。"}, {"q": "For a $1m 3-month Eurodollar contract, 1 basis point is worth:", "o": ["$100", "$25", "$12.50"], "a": 1, "why": "1,000,000 × 0.0001 × 1/4 = $25。"}, {"q": "\"Open outcry\" means:", "o": ["Electronic screen trading", "Buyers and sellers dealing face to face in a trading pit", "Trading over the phone"], "a": 1, "why": "Open outcry = 交易池面對面喊價。"}], "sheet": {"f": [{"t":
